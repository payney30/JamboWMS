<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Tasks — National Jamboree Work Orders</title>
<style>
:root{
  --pine:#1C3829; --pine-deep:#122A1D; --canvas:#EFEADC; --canvas-panel:#FBF8F0;
  --khaki-line:#D8CFB6; --ink:#241F14; --ink-soft:#5B5340; --hivis:#E8620C; --hivis-soft:#F4A25E;
  --amber:#C9962B; --olive:#5C7A4A; --moss:#3E6B4F; --slate:#5A7385; --closed:#7A8471;
  --danger-bg:#FBE4D6; --ok-bg:#E4EEE0;
  --font-display: 'Oswald', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'SF Mono', 'Consolas', 'Menlo', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--canvas);color:var(--ink);font-family:var(--font-body);}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 60px;}
.topbar{background:var(--moss);color:var(--canvas-panel);border-radius:10px;padding:16px 20px;
  display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 0 #2E5339;flex-wrap:wrap;gap:10px;}
.brand-eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--hivis-soft);margin:0 0 4px;}
.brand-title{font-family:var(--font-display);font-weight:600;font-size:20px;letter-spacing:.01em;margin:0;text-transform:uppercase;}
.logout-link{color:var(--canvas-panel);font-size:12px;text-decoration:underline;cursor:pointer;background:none;border:none;font-family:var(--font-body);}

#loginBox{background:var(--canvas-panel);border:1px solid var(--khaki-line);border-radius:10px;padding:24px;margin:40px auto;}
#loginBox label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin:14px 0 4px;}
#loginBox select,#loginBox input{width:100%;padding:12px;border:1px solid var(--khaki-line);border-radius:6px;font-size:16px;background:#fff;}
.btn{background:var(--moss);color:#fff;border:none;border-radius:6px;padding:12px 16px;font-size:14px;cursor:pointer;font-family:var(--font-body);}
.btn:hover{background:#2E5339;}
.btn:disabled{opacity:.55;cursor:not-allowed;}
.btn-ghost{background:transparent;color:var(--moss);border:1px solid var(--moss);}
.btn-ghost:hover{background:var(--moss);color:#fff;}
.btn-wide{width:100%;padding:14px;font-size:15px;margin-top:18px;}
#loginErr{color:var(--hivis);font-size:12px;min-height:16px;margin-top:8px;}

.section-title{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.06em;font-size:13px;color:var(--ink-soft);margin:22px 0 10px;display:flex;align-items:center;justify-content:space-between;}
.wo-card{background:var(--canvas-panel);border:1px solid var(--khaki-line);border-radius:8px;padding:14px;margin-bottom:10px;cursor:pointer;}
.wo-card:hover{border-color:var(--moss);}
.wo-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.wo-num{font-family:var(--font-mono);font-weight:600;}
.chip{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
.chip-Immediate,.chip-Same-Day{background:var(--danger-bg);color:var(--hivis);}
.chip-Next-Day{background:#FBF0D6;color:var(--amber);}
.chip-2-Days,.chip-3-Days{background:#E7E4DC;color:var(--ink-soft);}
.wo-desc{font-size:13px;color:var(--ink);margin-bottom:6px;}
.wo-meta{font-size:11px;color:var(--ink-soft);}
.empty-state{color:var(--ink-soft);font-size:13px;padding:20px 0;text-align:center;}

#detailView{display:none;}
#detailView.open{display:block;}
.close-link{color:var(--moss);font-size:13px;text-decoration:underline;cursor:pointer;background:none;border:none;font-family:var(--font-body);padding:0;margin-bottom:14px;}
.field{margin:12px 0;}
.field label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin-bottom:3px;}
.field .val{font-size:14px;white-space:pre-wrap;}
.field textarea{width:100%;padding:10px;border:1px solid var(--khaki-line);border-radius:6px;font-size:14px;font-family:var(--font-body);min-height:70px;}
#pinMap,#completionPinMap{height:200px;border-radius:8px;border:1px solid var(--khaki-line);margin-top:8px;}
.pin-actions{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap;}
.pin-status{font-size:12px;color:var(--ink-soft);}
.divider{border:none;border-top:1px solid var(--khaki-line);margin:18px 0;}

#toastStack{position:fixed;bottom:16px;left:16px;right:16px;z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{background:var(--pine);color:#fff;border-radius:8px;padding:10px 14px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.2);}
.toast.err{background:var(--hivis);}
.toast.ok{background:var(--moss);}
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <div>
      <p class="brand-eyebrow">National Jamboree</p>
      <h1 class="brand-title" id="pageTitle">My Tasks</h1>
    </div>
    <button class="logout-link" id="logoutBtn" onclick="logout()" style="display:none;">Log out</button>
  </div>

  <!-- Enhancement backlog Phase 21 (PRD §17#10): PIN login — team,
       then pick your name, then PIN. Nothing here requires typing an
       email or password; the PIN itself is the only secret. -->
  <div id="loginBox">
    <label>Team</label>
    <select id="lgTeam" onchange="onTeamChange()"><option value="">Choose your team…</option></select>
    <label>Your name</label>
    <select id="lgWorker" disabled><option value="">Choose your team first…</option></select>
    <label>PIN</label>
    <input id="lgPin" type="tel" inputmode="numeric" maxlength="4" placeholder="4-digit PIN">
    <button class="btn btn-wide" onclick="login()">Log in</button>
    <div id="loginErr"></div>
  </div>

  <div id="app" style="display:none;">
    <div class="section-title">Assigned to me <span id="queueCount"></span></div>
    <div id="queueList"></div>

    <div id="detailView">
      <button class="close-link" onclick="closeDetail()">&larr; Back to my tasks</button>
      <h2 id="dNum" style="font-family:var(--font-display);margin:0 0 2px;"></h2>
      <div id="dSub" style="font-size:12px;color:var(--ink-soft);margin-bottom:14px;"></div>

      <div class="field"><label>Location</label><div class="val" id="dLocation"></div></div>
      <div class="field"><label>Description</label><div class="val" id="dDescription"></div></div>
      <div id="dSubmissionPhotos"></div>
      <div id="dSubmissionPinWrap" style="display:none;">
        <div class="field"><label>Submitted location <a id="dSubmissionPinLink" href="#" target="_blank" rel="noopener" style="font-weight:400;">Open full map ↗</a></label>
          <div id="pinMap"></div>
        </div>
      </div>

      <hr class="divider">

      <div id="completeSection">
        <div class="section-title" style="margin-top:0;">Mark completed</div>
        <div class="field">
          <label>Note (optional)</label>
          <textarea id="cNote" placeholder="Anything worth noting…"></textarea>
        </div>
        <div class="field">
          <label>Photo of completed work (optional)</label>
          <input type="file" id="cPhoto" accept="image/*,application/pdf">
        </div>
        <div class="field">
          <label>Exact drop/completion location (optional)</label>
          <div class="pin-actions">
            <button type="button" class="btn btn-ghost" onclick="useMyLocation()">Use my current location</button>
            <button type="button" class="btn btn-ghost" id="clearPinBtn" onclick="clearCompletionPin()" style="display:none;">Clear pin</button>
            <span class="pin-status" id="cPinStatus"></span>
          </div>
          <div id="completionPinMap"></div>
        </div>
        <button class="btn btn-wide" id="completeBtn" onclick="markCompleted()">Mark completed</button>
      </div>
    </div>
  </div>
</div>

<div id="toastStack"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const API = '';
let TOKEN = localStorage.getItem('worker_token') || '';
let ME = null;
let LAST_QUEUE = [];
let currentWo = null;
let submissionMap = null, completionMap = null, completionMarker = null;

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s == null ? '' : s;
  return d.innerHTML;
}
function priorityClass(p){ return (p || '').replace(/\s+/g, '-'); }
function showToast(msg, kind){
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.textContent = msg;
  document.getElementById('toastStack').appendChild(el);
  setTimeout(() => el.remove(), 5000);
}

async function api(path, opts={}) {
  opts.headers = Object.assign({}, opts.headers, TOKEN ? {Authorization: 'Bearer ' + TOKEN} : {});
  if (opts.body && !(opts.body instanceof FormData)) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(opts.body);
  }
  let res;
  try {
    res = await fetch(API + path, opts);
  } catch (e) {
    throw new Error('Network error — check your connection and try again.');
  }
  if (res.status === 401) {
    localStorage.removeItem('worker_token');
    TOKEN = '';
    showLogin();
    throw new Error('session expired');
  }
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).detail || detail; } catch (e) {}
    throw new Error(detail);
  }
  if (res.status === 204) return null;
  return res.json();
}

async function boot(){
  try {
    const teams = await fetch(API + '/public/worker-login/teams').then(r => r.json());
    const sel = document.getElementById('lgTeam');
    teams.forEach(t => sel.insertAdjacentHTML('beforeend', `<option value="${t.id}">${escapeHtml(t.name)}</option>`));
  } catch (e) {
    document.getElementById('loginErr').textContent = 'Could not load teams — check your connection and refresh.';
  }
  if (TOKEN) {
    try {
      ME = await api('/users/me');
      showApp();
      return;
    } catch (e) {
      // token invalid/expired — fall through to login screen
    }
  }
  showLogin();
}

async function onTeamChange(){
  const teamId = document.getElementById('lgTeam').value;
  const workerSel = document.getElementById('lgWorker');
  workerSel.innerHTML = '<option value="">Loading…</option>';
  workerSel.disabled = true;
  if (!teamId) { workerSel.innerHTML = '<option value="">Choose your team first…</option>'; return; }
  try {
    const workers = await fetch(API + '/public/worker-login/workers?team_id=' + teamId).then(r => r.json());
    workerSel.innerHTML = '<option value="">Choose your name…</option>' +
      workers.map(w => `<option value="${w.id}">${escapeHtml(w.name)}</option>`).join('');
    workerSel.disabled = false;
  } catch (e) {
    workerSel.innerHTML = '<option value="">Could not load — try again</option>';
  }
}

async function login(){
  const errEl = document.getElementById('loginErr');
  errEl.textContent = '';
  const workerId = document.getElementById('lgWorker').value;
  const pin = document.getElementById('lgPin').value.trim();
  if (!workerId) { errEl.textContent = 'Choose your name first.'; return; }
  if (!/^\d{4}$/.test(pin)) { errEl.textContent = 'Enter your 4-digit PIN.'; return; }
  try {
    const data = await fetch(API + '/public/worker-login', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({worker_id: parseInt(workerId, 10), pin}),
    }).then(async r => {
      if (!r.ok) { const b = await r.json().catch(() => ({})); throw new Error(b.detail || 'Login failed'); }
      return r.json();
    });
    TOKEN = data.access_token;
    localStorage.setItem('worker_token', TOKEN);
    ME = await api('/users/me');
    showApp();
  } catch (e) {
    errEl.textContent = e.message;
  }
}

function logout(){
  localStorage.removeItem('worker_token');
  TOKEN = '';
  ME = null;
  showLogin();
}

function showLogin(){
  document.getElementById('loginBox').style.display = 'block';
  document.getElementById('app').style.display = 'none';
  document.getElementById('logoutBtn').style.display = 'none';
}

function showApp(){
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('logoutBtn').style.display = 'inline';
  document.getElementById('pageTitle').textContent = ME.name + "'s Tasks";
  loadQueue();
}

async function loadQueue(){
  let wos;
  try {
    wos = await api('/work-orders?exclude_closed=true');
  } catch (e) {
    if (e.message !== 'session expired') showToast('Could not load your tasks: ' + e.message, 'err');
    return;
  }
  LAST_QUEUE = wos;
  document.getElementById('queueCount').textContent = `(${wos.length})`;
  const el = document.getElementById('queueList');
  if (!wos.length) { el.innerHTML = '<div class="empty-state">Nothing assigned to you right now.</div>'; return; }
  el.innerHTML = wos.map(w => `
    <div class="wo-card" onclick="openDetail(${w.id})">
      <div class="wo-card-top">
        <span class="wo-num">${escapeHtml(w.wo_number)}</span>
        <span class="chip chip-${priorityClass(w.priority)}">${w.priority}</span>
      </div>
      <div class="wo-desc">${escapeHtml((w.description||'').slice(0,140))}</div>
      <div class="wo-meta">${escapeHtml(w.asset ? w.asset.name : '')}</div>
    </div>
  `).join('');
}

async function openDetail(id){
  let w;
  try {
    w = await api('/work-orders/' + id);
  } catch (e) {
    if (e.message !== 'session expired') showToast('Could not load task: ' + e.message, 'err');
    return;
  }
  currentWo = w;
  document.querySelectorAll('.wrap > #app > .section-title').forEach(el => el.style.display = 'none');
  document.getElementById('queueList').style.display = 'none';
  document.getElementById('detailView').classList.add('open');

  document.getElementById('dNum').textContent = w.wo_number;
  document.getElementById('dSub').innerHTML = `${escapeHtml(w.work_type || 'No work type')} &middot; <span class="chip chip-${priorityClass(w.priority)}">${w.priority}</span>`;
  document.getElementById('dLocation').textContent = w.asset ? w.asset.name : '—';
  document.getElementById('dDescription').textContent = w.description;

  const submissionPhotos = (w.attachments || []).filter(a => a.stage !== 'completion');
  const photosEl = document.getElementById('dSubmissionPhotos');
  if (submissionPhotos.length) {
    photosEl.innerHTML = `<div class="field"><label>Submitted photos</label><div style="display:flex;gap:8px;flex-wrap:wrap;">` +
      submissionPhotos.map(a => {
        const isPdf = /\.pdf($|\?)/i.test(a.file_url);
        if (isPdf) return `<a href="${a.file_url}" target="_blank" rel="noopener" style="width:64px;height:64px;display:flex;align-items:center;justify-content:center;border:1px solid var(--khaki-line);border-radius:6px;background:#F1EDDF;font-size:22px;text-decoration:none;">📄</a>`;
        return `<a href="${a.file_url}" target="_blank" rel="noopener"><img src="${a.file_url}" style="width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--khaki-line);" onerror="this.style.display='none';"></a>`;
      }).join('') + `</div></div>`;
  } else {
    photosEl.innerHTML = '';
  }

  const hasPin = w.latitude != null && w.longitude != null;
  document.getElementById('dSubmissionPinWrap').style.display = hasPin ? 'block' : 'none';
  if (hasPin) {
    document.getElementById('dSubmissionPinLink').href = `https://www.openstreetmap.org/?mlat=${w.latitude}&mlon=${w.longitude}&zoom=17`;
    if (submissionMap) { submissionMap.remove(); submissionMap = null; }
    submissionMap = L.map('pinMap', {zoomControl:false}).setView([w.latitude, w.longitude], 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; OpenStreetMap contributors'}).addTo(submissionMap);
    L.marker([w.latitude, w.longitude]).addTo(submissionMap);
  }

  document.getElementById('cNote').value = '';
  document.getElementById('cPhoto').value = '';
  clearCompletionPin();
  if (completionMap) { completionMap.remove(); completionMap = null; }
  completionMap = L.map('completionPinMap').setView(hasPin ? [w.latitude, w.longitude] : [37.860, -81.132], hasPin ? 15 : 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; OpenStreetMap contributors'}).addTo(completionMap);
  completionMap.on('click', (e) => placeCompletionPin(e.latlng.lat, e.latlng.lng));
}

function closeDetail(){
  currentWo = null;
  document.getElementById('detailView').classList.remove('open');
  document.querySelectorAll('.wrap > #app > .section-title').forEach(el => el.style.display = 'flex');
  document.getElementById('queueList').style.display = 'block';
  loadQueue();
}

function placeCompletionPin(lat, lng){
  if (completionMarker) {
    completionMarker.setLatLng([lat, lng]);
  } else {
    completionMarker = L.marker([lat, lng], {draggable: true}).addTo(completionMap);
    completionMarker.on('dragend', () => {
      const pos = completionMarker.getLatLng();
      updateCompletionPinStatus(pos.lat, pos.lng);
    });
    document.getElementById('clearPinBtn').style.display = '';
  }
  completionMap.panTo([lat, lng]);
  updateCompletionPinStatus(lat, lng);
}
function updateCompletionPinStatus(lat, lng){
  document.getElementById('cPinStatus').textContent = `Pinned at ${lat.toFixed(5)}, ${lng.toFixed(5)} — drag to adjust.`;
}
function clearCompletionPin(){
  if (completionMarker && completionMap) { completionMap.removeLayer(completionMarker); }
  completionMarker = null;
  document.getElementById('clearPinBtn').style.display = 'none';
  document.getElementById('cPinStatus').textContent = '';
}
function useMyLocation(){
  const statusEl = document.getElementById('cPinStatus');
  if (!navigator.geolocation) {
    statusEl.textContent = "Your device doesn't support location — tap the map to drop a pin manually.";
    return;
  }
  statusEl.textContent = 'Finding your location…';
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      placeCompletionPin(pos.coords.latitude, pos.coords.longitude);
      completionMap.setView([pos.coords.latitude, pos.coords.longitude], 17);
    },
    () => { statusEl.textContent = "Couldn't get your location — tap the map to drop a pin manually."; },
    {enableHighAccuracy: true, timeout: 10000}
  );
}

async function markCompleted(){
  if (!currentWo) return;
  const btn = document.getElementById('completeBtn');
  btn.disabled = true;
  btn.textContent = 'Saving…';
  try {
    const payload = {note: document.getElementById('cNote').value || null};
    if (completionMarker) {
      const pos = completionMarker.getLatLng();
      payload.completion_latitude = pos.lat;
      payload.completion_longitude = pos.lng;
    }
    await api(`/work-orders/${currentWo.id}/complete`, {method: 'POST', body: payload});

    const file = document.getElementById('cPhoto').files[0];
    if (file) {
      const fd = new FormData();
      fd.append('file', file);
      await api(`/work-orders/${currentWo.id}/attachments`, {method: 'POST', body: fd});
    }

    showToast('Marked completed.', 'ok');
    closeDetail();
  } catch (e) {
    if (e.message !== 'session expired') showToast('Could not mark completed: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Mark completed';
  }
}

boot();
</script>
</body>
</html>
