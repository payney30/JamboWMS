services:
  - type: web
    name: nj-loc-work-orders
    runtime: python
    # Repo layout has everything under a phase1/ subfolder rather than at
    # the repo root — rootDir tells Render to run buildCommand/startCommand
    # from inside there, so `pip install -r requirements.txt` etc. resolve
    # correctly. If you ever flatten the repo so phase1/'s contents sit at
    # the root instead, delete this line.
    rootDir: phase1
    # "starter" avoids the free tier's 15-min-inactivity sleep, which
    # would give testers an annoying ~30-50s cold start on their first
    # click of the day. Confirm this plan name still exists in Render's
    # dashboard before deploying — plan names/pricing change over time.
    plan: starter
    buildCommand: pip install -r requirements.txt
    # Enhancement backlog Phase 16: attachment storage fix (PRD §14#29).
    # Local disk storage (app/routers/public.py's UPLOAD_DIR) doesn't
    # survive a redeploy on Render's default ephemeral filesystem —
    # confirmed in production 7/29/26, every attachment uploaded before
    # a redeploy went missing after it. A Render persistent disk fixes
    # this: it's mounted at the same path across restarts/redeploys, so
    # UPLOAD_DIR (set below) now points at real, durable storage instead
    # of the container's throwaway filesystem. Only works with a single
    # service instance (no horizontal autoscaling) — not a constraint
    # this app has today, but worth knowing if that ever changes; an
    # S3-compatible object store (e.g. Cloudflare R2, no egress fees) is
    # the option to revisit at that point instead of this disk.
    disk:
      name: uploads
      mountPath: /var/data/uploads
      sizeGB: 1
    # seed.py re-runs on every deploy, not just the first one -- it's
    # idempotent (upserts by name), and this is what closes the gap that
    # caused the location picker to silently go flat in production: a
    # migration can add a new backfill-requiring column (e.g. parent_id),
    # but only seed.py's second pass actually populates it on existing
    # rows. check_location_hierarchy.py then fails the deploy loudly if
    # the hierarchy still looks flat, instead of shipping a broken picker.
    startCommand: "alembic upgrade head && python seed.py && python check_location_hierarchy.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        fromDatabase:
          name: nj-loc-work-orders-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Enhancement backlog Phase 16 (PRD §14#29): points attachment
      # storage at the persistent disk mounted above, instead of
      # app/routers/public.py's UPLOAD_DIR default ("uploads", a
      # relative path in the container's ephemeral filesystem — gone on
      # every redeploy). Must exactly match disk.mountPath above.
      - key: UPLOAD_DIR
        value: /var/data/uploads
      # CORS_ALLOWED_ORIGINS intentionally left unset — the triage UI and
      # requester form are served by this same app (see app/main.py), so
      # same-origin requests never need it. Only set this if a separate
      # frontend origin needs to call the API directly.

      # Enhancement backlog Phase 25 (PRD §17#6-8): SMS + email
      # notifications. Everything here is read by app/notifications.py
      # at call time (not cached at import), so switching from the
      # trial Twilio/SendGrid accounts to production ones later is just
      # updating these values in Render's dashboard — no redeploy of
      # application code needed either way.
      #
      # NOTIFICATIONS_ENABLED is the kill switch — defaults to "false"
      # here on purpose. Flip to "true" only once ready to actually
      # send real messages (e.g. after verifying test phone numbers in
      # Twilio's trial console, and confirming SendGrid sender
      # verification/domain auth has passed).
      - key: NOTIFICATIONS_ENABLED
        value: "false"
      # Secrets — set these directly in the Render dashboard (Environment
      # tab), not in this file. sync: false means Render won't overwrite
      # whatever's already set there on future blueprint syncs.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      # Not secrets — safe to keep in version control.
      - key: SENDGRID_FROM_EMAIL
        value: graeme@cybersecurity4executives.com
      - key: SENDGRID_FROM_NAME
        value: JamboWMS
      - key: SENDGRID_REPLY_TO
        value: marketing@cybersecurity4executives.com

databases:
  - name: nj-loc-work-orders-db
    # Confirm this plan name in Render's dashboard before deploying —
    # same caveat as above.
  
