<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOC Triage — National Jamboree Work Orders</title>
<style>
:root{
  --pine:#1C3829;
  --pine-deep:#122A1D;
  --canvas:#EFEADC;
  --canvas-panel:#FBF8F0;
  --khaki-line:#D8CFB6;
  --ink:#241F14;
  --ink-soft:#5B5340;
  --hivis:#E8620C;
  --hivis-soft:#F4A25E;
  --amber:#C9962B;
  --olive:#5C7A4A;
  --moss:#3E6B4F;
  --slate:#5A7385;
  --closed:#7A8471;
  --danger-bg:#FBE4D6;
  --ok-bg:#E4EEE0;
  --font-display: 'Oswald', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'SF Mono', 'Consolas', 'Menlo', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--canvas);color:var(--ink);font-family:var(--font-body);}
.wrap{max-width:1280px;margin:0 auto;padding:28px 24px 60px;}
.topbar{background:var(--pine);color:var(--canvas-panel);border-radius:10px;padding:20px 26px;
  display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 0 var(--pine-deep);flex-wrap:wrap;gap:10px;}
.brand-eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--hivis-soft);margin:0 0 4px;}
.brand-title{font-family:var(--font-display);font-weight:600;font-size:26px;letter-spacing:.01em;margin:0;text-transform:uppercase;}
#loginBox{background:var(--canvas-panel);border:1px solid var(--khaki-line);border-radius:10px;padding:24px;max-width:360px;margin:60px auto;}
#loginBox input{width:100%;padding:10px;margin:6px 0 14px;border:1px solid var(--khaki-line);border-radius:6px;font-size:14px;}
#loginBox button, .btn{background:var(--pine);color:#fff;border:none;border-radius:6px;padding:10px 16px;font-size:13px;cursor:pointer;font-family:var(--font-body);}
#loginBox button:hover, .btn:hover{background:var(--pine-deep);}
.btn:disabled{opacity:.55;cursor:not-allowed;}
.btn-ghost{background:transparent;color:var(--pine);border:1px solid var(--pine);}
.btn-ghost:hover{background:var(--pine);color:#fff;}
#loginErr{color:var(--hivis);font-size:12px;min-height:16px;}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:18px;}
.kpi{background:var(--canvas-panel);border:1px solid var(--khaki-line);border-radius:8px;padding:14px 16px;position:relative;}
.kpi.clickable{cursor:pointer;}
.kpi.clickable:hover{border-color:var(--pine);}
.kpi.active{border-color:var(--pine);border-width:2px;background:var(--ok-bg);}
.kpi .num{font-family:var(--font-display);font-size:26px;font-weight:600;line-height:1;}
.kpi .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin-top:6px;}
th.sortable{cursor:pointer;user-select:none;white-space:nowrap;}
th.sortable:hover{color:var(--pine);}
.sort-icon{font-size:9px;opacity:.45;margin-left:3px;}
.sort-icon.active{opacity:1;color:var(--pine);}

.section-title{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.06em;font-size:13px;color:var(--ink-soft);margin:26px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.section-title .hint{font-family:var(--font-body);text-transform:none;letter-spacing:normal;font-size:11px;color:var(--ink-soft);opacity:.75;}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.filters select,.filters input{padding:8px 10px;border:1px solid var(--khaki-line);border-radius:6px;font-size:13px;background:var(--canvas-panel);}
.filters input{flex:1;min-width:180px;}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px;}
.chip-btn{background:var(--canvas-panel);border:1px solid var(--khaki-line);border-radius:20px;padding:5px 12px;font-size:12px;cursor:pointer;color:var(--ink-soft);}
.chip-btn:hover{border-color:var(--pine);color:var(--pine);}
.chip-btn.active{background:var(--pine);border-color:var(--pine);color:#fff;}

table{width:100%;border-collapse:collapse;background:var(--canvas-panel);border:1px solid var(--khaki-line);border-radius:8px;overflow:hidden;font-size:13px;}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--khaki-line);}
th{background:#F1EDDF;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);}
tr:hover td{background:#F5F1E4;cursor:pointer;}
.chip{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
.chip-Highest,.chip-High{background:var(--danger-bg);color:var(--hivis);}
.chip-Medium{background:#FBF0D6;color:var(--amber);}
.chip-Low,.chip-Lowest{background:#E7E4DC;color:var(--ink-soft);}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;}
.empty-row td{color:var(--ink-soft);text-align:center;padding:22px 12px;}
.loading-row td{color:var(--ink-soft);text-align:center;padding:22px 12px;font-family:var(--font-mono);font-size:12px;}

#drawer{position:fixed;top:0;right:-460px;width:440px;height:100%;background:var(--canvas-panel);
  border-left:1px solid var(--khaki-line);box-shadow:-6px 0 20px rgba(0,0,0,.15);transition:right .2s;overflow-y:auto;padding:24px;z-index:10;}
#drawer.open{right:0;}
#drawerBackdrop{position:fixed;inset:0;background:rgba(0,0,0,.25);display:none;z-index:9;}
#drawerBackdrop.open{display:block;}
#drawer h2{font-family:var(--font-display);font-size:18px;margin:0 0 4px;}
#drawer label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin:14px 0 4px;}
#drawer select,#drawer textarea,#drawer input{width:100%;padding:8px;border:1px solid var(--khaki-line);border-radius:6px;font-size:13px;font-family:var(--font-body);}
#drawer textarea{min-height:60px;}
.close-btn{position:absolute;top:18px;right:18px;background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink-soft);}
.note{background:#F1EDDF;border-radius:6px;padding:8px 10px;margin:6px 0;font-size:12px;}
.note .meta{color:var(--ink-soft);font-size:10px;margin-top:3px;}
.hist{font-size:11px;color:var(--ink-soft);padding:4px 0;border-bottom:1px dashed var(--khaki-line);}
.drawer-group{border-top:1px dashed var(--khaki-line);padding-top:14px;margin-top:14px;}
.drawer-group:first-of-type{border-top:none;margin-top:0;padding-top:0;}
.drawer-actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;}
.field-err{color:var(--hivis);font-size:11px;margin-top:4px;min-height:14px;}

#toastStack{position:fixed;bottom:20px;right:20px;z-index:50;display:flex;flex-direction:column;gap:8px;max-width:340px;}
.toast{background:var(--pine);color:#fff;border-radius:8px;padding:10px 14px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.2);}
.toast.err{background:var(--hivis);}
.toast.ok{background:var(--moss);}
/* Enhancement backlog Phase 3 (PRD §14#12): print-to-PDF for a single
   WO. Explicitly display:none every other top-level element (NOT
   visibility:hidden — that hides content but leaves its layout space
   behind, which is what caused the original bug: the full inbox table
   in #app stayed full-height-but-invisible, and the browser paginated
   that entire empty height into dozens of blank pages behind the
   drawer). #drawer also gets its screen-only fixed/height/scroll styles
   reset so it prints as normal in-flow content sized to what's actually
   in it, not a 100%-tall fixed panel. */
@media print {
  #loginBox, #app, #drawerBackdrop, #toastStack { display: none !important; }
  #drawer {
    display: block !important;
    position: static !important;
    top: auto !important; right: auto !important;
    width: auto !important;
    height: auto !important;
    max-height: none !important;
    overflow: visible !important;
    box-shadow: none !important;
    border: none !important;
    transition: none !important;
  }
  #drawer .close-btn, #drawer .drawer-actions, #drawer .drawer-group { display: none !important; }
  #drawer .print-only { display: block !important; }
}
.print-only { display: none; }
</style>
</head>
<body>

<div id="loginBox">
  <h2 style="font-family:var(--font-display);margin-top:0;">LOC Triage Login</h2>
  <label>Email</label><input id="loginEmail" type="email" autocomplete="username">
  <label>Password</label><input id="loginPass" type="password" autocomplete="current-password">
  <button onclick="login()">Sign in</button>
  <div id="loginErr"></div>
</div>

<div class="wrap" id="app" style="display:none;">
  <div class="topbar">
    <div>
      <p class="brand-eyebrow">Live &middot; National Jamboree Work Orders</p>
      <h1 class="brand-title">LOC Triage</h1>
    </div>
    <button class="btn" onclick="logout()">Sign out</button>
  </div>

  <div class="kpis" id="kpiRow"></div>

  <div class="section-title">
    <span>Filter</span>
    <span class="hint" id="sortHint">Inbox sorted by priority, then oldest first</span>
  </div>
  <div class="filters">
    <select id="fStatus" onchange="load()"><option value="">All Statuses</option></select>
    <select id="fPriority" onchange="load()"><option value="">All Priorities</option></select>
    <select id="fWorkType" onchange="load()"><option value="">All Work Types</option></select>
    <select id="fLocation" onchange="load()"><option value="">All Locations</option></select>
    <select id="fTeam" onchange="load()"><option value="">All Teams</option></select>
    <!-- Enhancement backlog Phase 4 (PRD §14#17): "work orders I've
         handled" — filters to WOs where the selected user appears in
         status history or notes, not just currently-assigned WOs. -->
    <select id="fHandledBy" onchange="load()"><option value="">Anyone (handled)</option></select>
    <input id="fSearch" placeholder="Search description or WO#…" oninput="debouncedLoad()">
    <button class="btn btn-ghost" onclick="clearFilters()">Clear filters</button>
    <!-- Enhancement backlog Phase 3 (PRD §14#12): exports exactly what's
         currently filtered/sorted in the inbox, not a full unfiltered dump. -->
    <button class="btn btn-ghost" onclick="exportInboxCsv()">Export CSV</button>
    <button class="btn" onclick="openNewWO()">+ New WO</button>
  </div>
  <div class="chips" id="quickViews"></div>

  <div class="section-title">Inbox</div>
  <table>
    <thead><tr>
      <th class="sortable" onclick="setSort('wo_number')">WO# <span class="sort-icon" id="sortIcon-wo_number"></span></th>
      <th class="sortable" onclick="setSort('priority')">Priority <span class="sort-icon" id="sortIcon-priority"></span></th>
      <th class="sortable" onclick="setSort('status')">Status <span class="sort-icon" id="sortIcon-status"></span></th>
      <th>Description</th>
      <th class="sortable" onclick="setSort('location')">Location <span class="sort-icon" id="sortIcon-location"></span></th>
      <th class="sortable" onclick="setSort('team')">Team <span class="sort-icon" id="sortIcon-team"></span></th>
      <th class="sortable" onclick="setSort('created')">Created <span class="sort-icon" id="sortIcon-created"></span></th>
    </tr></thead>
    <tbody id="woTableBody"><tr class="loading-row"><td colspan="7">Loading…</td></tr></tbody>
  </table>
</div>

<div id="drawerBackdrop" onclick="closeDrawer()"></div>
<div id="drawer"></div>
<div id="toastStack"></div>

<script src="location-picker.js"></script>
<script>
const API = '';
let TOKEN = localStorage.getItem('loc_token') || '';
let TEAMS = [], ASSETS = [];
// Enhancement backlog Phase 4 (PRD §15#1): admin-configured display time
// zone, fetched at boot from the public (no-auth) settings endpoint —
// same source the Submit WO page reads, so every screen agrees on the
// same clock regardless of the viewing browser's own local time zone.
// Defaults to UTC only if the fetch itself fails; the backend's own
// default is America/New_York (see crud.DEFAULT_TIMEZONE).
let APP_TIMEZONE = 'UTC';

// Enhancement backlog Phase 4 (PRD §15#1): use these everywhere instead
// of bare toLocaleString()/toLocaleTimeString() — those format against
// the viewing browser's local time zone, which is exactly what this
// feature replaces.
function fmtDateTime(iso){
  if (!iso) return '—';
  return new Date(iso).toLocaleString('en-US', {timeZone: APP_TIMEZONE});
}
function fmtTime(iso){
  if (!iso) return '—';
  return new Date(iso).toLocaleTimeString('en-US', {timeZone: APP_TIMEZONE});
}
// Enhancement backlog Phase 4 (PRD §14#17): populates the "Handled by"
// filter dropdown.
let USERS = [];
let drawerLocationPicker = null, newWoLocationPicker = null;
let activeQuickView = '';
let currentSort = {key: null, dir: 'asc'};
let LAST_WOS = [];
// Enhancement backlog Phase 1 (PRD §14#1, §14#2): who's logged in (needed
// to tell "I hold this lock" apart from "someone else does"), and drawer
// editing state — which WO is currently open, whether we hold its lock
// (i.e. the drawer is editable vs. read-only), and whether there are
// unsaved changes so closing/navigating away can prompt instead of
// silently discarding.
let CURRENT_USER = null;
let drawerState = {woId: null, editable: false, dirty: false};
const PRIORITY_ORDER = {"Highest":0,"High":1,"Medium":2,"Low":3,"Lowest":4};
const STATUSES = ["Requested","Assigned","Work In Progress","On Hold","Closed, Completed","Closed, Incomplete"];
const PRIORITIES = ["Highest","High","Medium","Low","Lowest"];
const WORK_TYPES = ["NJ Maintenance","NJ IT","NJ Items/Parts","NJ Transportation"];
const STATUS_COLOR = {"Requested":"#C9962B","Assigned":"#3E6B4F","Work In Progress":"#E8620C","On Hold":"#5A7385","Closed, Completed":"#7A8471","Closed, Incomplete":"#7A8471"};
const QUICK_VIEWS = [
  {key:'', label:'All'},
  {key:'Requested', label:'Requested'},
  {key:'Assigned', label:'Assigned'},
  {key:'Work In Progress', label:'In Progress'},
  {key:'On Hold', label:'On Hold'},
  {key:'HighestHighOpen', label:'Highest + High, open'},
  {key:'Closed', label:'Closed'},
];

function showToast(msg, kind){
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.textContent = msg;
  document.getElementById('toastStack').appendChild(el);
  setTimeout(() => el.remove(), 5000);
}

async function api(path, opts={}) {
  opts.headers = Object.assign({}, opts.headers, TOKEN ? {Authorization: 'Bearer ' + TOKEN} : {});
  if (opts.body && !(opts.body instanceof URLSearchParams)) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(opts.body);
  }
  let res;
  try {
    res = await fetch(API + path, opts);
  } catch (e) {
    throw new Error('Network error — check your connection and try again.');
  }
  if (res.status === 401 && path !== '/auth/login') {
    localStorage.removeItem('loc_token');
    TOKEN = '';
    document.getElementById('app').style.display = 'none';
    document.getElementById('loginBox').style.display = 'block';
    document.getElementById('loginErr').textContent = 'Your session expired — please sign in again.';
    throw new Error('session expired');
  }
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).detail || detail; } catch (e) {}
    const err = new Error(detail);
    err.status = res.status;
    throw err;
  }
  return res.status === 204 ? null : res.json();
}

async function login() {
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginErr');
  errEl.textContent = '';
  if (!email || !pass) { errEl.textContent = 'Enter both an email and a password.'; return; }
  const body = new URLSearchParams({username: email, password: pass});
  try {
    const data = await api('/auth/login', {method:'POST', body});
    TOKEN = data.access_token;
    localStorage.setItem('loc_token', TOKEN);
    await boot();
  } catch(e) {
    errEl.textContent = e.status === 429 ? e.message : (e.message || 'Sign-in failed.');
  }
}
function logout(){ localStorage.removeItem('loc_token'); TOKEN=''; location.reload(); }

async function boot() {
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  try {
    CURRENT_USER = await api('/users/me');
    TEAMS = await api('/teams');
    ASSETS = await api('/assets');
    // loc/admin only — techs can't reach GET /users, and the "handled by"
    // filter is a triage-staff tool, not something a tech's own queue
    // view needs. Fail soft: an empty dropdown just means the filter
    // isn't offered, not a broken page.
    if (CURRENT_USER.role === 'loc' || CURRENT_USER.role === 'admin') {
      try { USERS = await api('/users'); } catch (e) { USERS = []; }
    }
  } catch (e) {
    showToast('Could not load reference data: ' + e.message, 'err');
    return;
  }
  // Enhancement backlog Phase 4 (PRD §15#1). No-auth endpoint, no token
  // needed — best-effort: if it fails, APP_TIMEZONE just stays at its
  // 'UTC' fallback rather than blocking the whole page from loading.
  try {
    const settings = await fetch('/public/settings').then(r => r.json());
    APP_TIMEZONE = settings.timezone || 'UTC';
  } catch (e) { /* keep the UTC fallback */ }
  populateFilterOptions();
  renderQuickViews();
  await load();
}

function populateFilterOptions(){
  const fStatus = document.getElementById('fStatus');
  STATUSES.forEach(s => fStatus.insertAdjacentHTML('beforeend', `<option value="${s}">${s}</option>`));
  const fPriority = document.getElementById('fPriority');
  PRIORITIES.forEach(p => fPriority.insertAdjacentHTML('beforeend', `<option value="${p}">${p}</option>`));
  const fWorkType = document.getElementById('fWorkType');
  WORK_TYPES.forEach(w => fWorkType.insertAdjacentHTML('beforeend', `<option value="${w}">${w}</option>`));
  const fTeam = document.getElementById('fTeam');
  TEAMS.forEach(t => fTeam.insertAdjacentHTML('beforeend', `<option value="${t.id}">${t.name}</option>`));
  const fLocation = document.getElementById('fLocation');
  const locations = Array.from(new Set(ASSETS.map(a => a.location_group))).sort();
  locations.forEach(l => fLocation.insertAdjacentHTML('beforeend', `<option value="${l}">${l}</option>`));
  // Enhancement backlog Phase 4 (PRD §14#17). USERS is only populated
  // for loc/admin (see boot()) — for anyone else this is just an empty
  // "Anyone (handled)" dropdown, which is harmless.
  const fHandledBy = document.getElementById('fHandledBy');
  USERS.forEach(u => fHandledBy.insertAdjacentHTML('beforeend', `<option value="${u.id}">${escapeHtml(u.name)}</option>`));
}

function renderQuickViews(){
  document.getElementById('quickViews').innerHTML = QUICK_VIEWS.map(v =>
    `<button class="chip-btn ${activeQuickView===v.key?'active':''}" onclick="applyQuickView('${v.key}')">${v.label}</button>`
  ).join('');
}

function applyQuickView(key){
  activeQuickView = key;
  renderQuickViews();
  if (['','HighestHighOpen','Closed','OpenActive','OpenedToday','ClosedToday','ApproachingDeadline','PastDeadline'].includes(key)) {
    document.getElementById('fStatus').value = '';
    document.getElementById('fPriority').value = '';
  } else {
    document.getElementById('fStatus').value = key;
    document.getElementById('fPriority').value = '';
  }
  load();
}

function clearFilters(){
  ['fStatus','fPriority','fWorkType','fLocation','fTeam','fHandledBy'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fSearch').value = '';
  activeQuickView = '';
  renderQuickViews();
  load();
}

let debounceTimer;
function debouncedLoad(){ clearTimeout(debounceTimer); debounceTimer = setTimeout(load, 300); }

async function load() {
  document.getElementById('woTableBody').innerHTML = '<tr class="loading-row"><td colspan="7">Loading…</td></tr>';

  const params = new URLSearchParams();
  const status = document.getElementById('fStatus').value;
  const priority = document.getElementById('fPriority').value;
  const workType = document.getElementById('fWorkType').value;
  const location = document.getElementById('fLocation').value;
  const team = document.getElementById('fTeam').value;
  const handledBy = document.getElementById('fHandledBy').value;
  const search = document.getElementById('fSearch').value;

  // These quick views used to be applied client-side against whatever
  // page the default limit happened to return. With priority-then-
  // oldest-first sort and a limit well below the total row count, a
  // newly-created low-priority WO (exactly the "Opened Today" case)
  // sorts near the *end* and never made it into the fetched page at
  // all — so the client-side filter had nothing to find even though
  // the WO existed. These are now real server-side filters, so
  // pagination is applied *after* filtering and nothing gets silently
  // excluded before the client ever sees it.
  if (activeQuickView === 'HighestHighOpen') {
    params.set('priority_in', 'Highest,High');
    params.set('exclude_closed', 'true');
  } else if (activeQuickView === 'Closed') {
    params.set('closed_only', 'true');
  } else if (activeQuickView === 'OpenActive') {
    params.set('exclude_closed', 'true');
  } else if (activeQuickView === 'OpenedToday') {
    params.set('opened_today', 'true');
  } else if (activeQuickView === 'ClosedToday') {
    params.set('closed_today', 'true');
  } else if (activeQuickView === 'ApproachingDeadline') {
    params.set('approaching_deadline', 'true');
  } else if (activeQuickView === 'PastDeadline') {
    params.set('past_deadline', 'true');
  } else if (status) {
    params.set('status', status);
  }
  if (priority) params.set('priority', priority);
  if (workType) params.set('work_type', workType);
  if (location) params.set('location_group', location);
  if (team) params.set('team_id', team);
  if (handledBy) params.set('handled_by', handledBy);
  if (search) params.set('search', search);
  params.set('limit', '200');

  let wos, kpis;
  try {
    [wos, kpis] = await Promise.all([
      api('/work-orders?' + params.toString()),
      api('/dashboard/kpis'),
    ]);
  } catch (e) {
    if (e.message !== 'session expired') showToast('Could not load work orders: ' + e.message, 'err');
    document.getElementById('woTableBody').innerHTML = '<tr class="empty-row"><td colspan="7">Could not load work orders.</td></tr>';
    return;
  }

  LAST_WOS = wos;
  renderKPIs(kpis);
  renderTable(sortWOs(wos));
}

// Enhancement backlog Phase 3 (PRD §14#12): exports the CURRENT
// filtered + sorted inbox view (LAST_WOS run through the same sortWOs()
// used to render the table), not a raw full-table dump — so what's
// downloaded matches what's on screen when the button is clicked.
function csvEscape(v){
  const s = String(v ?? '');
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function exportInboxCsv(){
  const rows = sortWOs(LAST_WOS);
  if (!rows.length) { showToast('Nothing to export — no work orders match the current filters.', 'err'); return; }
  const headers = ['WO Number', 'Fiix #', 'Priority', 'Status', 'Description', 'Location', 'Team', 'Created At'];
  const lines = [headers.map(csvEscape).join(',')];
  for (const w of rows) {
    lines.push([
      w.wo_number,
      w.external_ref || '',
      w.priority,
      w.status,
      w.description || '',
      w.asset ? w.asset.name : '',
      w.assigned_team ? w.assigned_team.name : '',
      fmtDateTime(w.created_at),
    ].map(csvEscape).join(','));
  }
  const blob = new Blob([lines.join('\n')], {type: 'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `work-orders-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function sortValue(w, key){
  switch(key){
    // Enhancement backlog Phase 4 (PRD §14#16): true numeric sort, not
    // string sort — matters once WO numbers pass 5 digits (string sort
    // would otherwise rank "100000" before "99999"). Depends on §14#13
    // (no more "WO-" prefix) — parseInt against a prefixed string would
    // have returned NaN.
    case 'wo_number': return parseInt(w.wo_number, 10) || 0;
    case 'priority': return PRIORITY_ORDER[w.priority] ?? 99;
    case 'status': return w.status || '';
    case 'location': return (w.asset ? w.asset.name : '') || '';
    case 'team': return (w.assigned_team ? w.assigned_team.name : '') || '';
    case 'created': return new Date(w.created_at).getTime();
    default: return '';
  }
}

function sortWOs(wos){
  if (!currentSort.key) return wos; // server default: priority, then oldest first
  const dir = currentSort.dir === 'asc' ? 1 : -1;
  return [...wos].sort((a, b) => {
    const av = sortValue(a, currentSort.key), bv = sortValue(b, currentSort.key);
    if (av < bv) return -1 * dir;
    if (av > bv) return 1 * dir;
    return 0;
  });
}

function setSort(key){
  if (currentSort.key === key) {
    currentSort.dir = currentSort.dir === 'asc' ? 'desc' : 'asc';
  } else {
    currentSort = {key, dir: 'asc'};
  }
  document.querySelectorAll('.sort-icon').forEach(el => { el.textContent = ''; el.classList.remove('active'); });
  const icon = document.getElementById('sortIcon-' + key);
  icon.textContent = currentSort.dir === 'asc' ? '▲' : '▼';
  icon.classList.add('active');
  const labels = {wo_number:'WO#', priority:'Priority', status:'Status', location:'Location', team:'Team', created:'Created'};
  document.getElementById('sortHint').textContent = `Sorted by ${labels[key]} (${currentSort.dir === 'asc' ? 'ascending' : 'descending'})`;
  renderTable(sortWOs(LAST_WOS));
}

function renderKPIs(k){
  const items = [
    {num:k.total, lbl:'Total', key:''},
    {num:k.open, lbl:'Open / Active', key:'OpenActive'},
    {num:k.highest_high_open, lbl:'Highest+High Open', key:'HighestHighOpen'},
    {num:k.closed, lbl:'Closed', key:'Closed'},
    {num:k.completion_rate+'%', lbl:'Completion Rate', key:null},
    {num:k.opened_today, lbl:'Opened Today', key:'OpenedToday'},
    {num:k.closed_today, lbl:'Closed Today', key:'ClosedToday'},
    // Enhancement backlog Phase 5 (PRD §14#10).
    {num:k.approaching_deadline, lbl:'Approaching Deadline', key:'ApproachingDeadline'},
    {num:k.past_deadline, lbl:'Past Deadline', key:'PastDeadline'},
  ];
  document.getElementById('kpiRow').innerHTML = items.map(i => {
    const clickable = i.key !== null;
    const active = clickable && activeQuickView === i.key;
    return `<div class="kpi ${clickable ? 'clickable' : ''} ${active ? 'active' : ''}"
      ${clickable ? `onclick="applyQuickView('${i.key}')"` : ''}>
      <div class="num">${i.num}</div><div class="lbl">${i.lbl}</div>
    </div>`;
  }).join('');
}

function renderTable(wos){
  document.getElementById('woTableBody').innerHTML = wos.map(w => {
    // Enhancement backlog Phase 1 (PRD §14#1): lock icon + hover tooltip.
    // w.locked_by is already null if the lock has gone stale (see
    // WorkOrder.locked_by on the backend), so a stale lock just shows
    // no icon at all rather than needing separate staleness handling here.
    const lockIcon = w.locked_by
      ? `<span class="lock-icon" title="Locked by ${escapeHtml(w.locked_by.name)} since ${fmtTime(w.locked_at)}" style="margin-right:4px;cursor:help;">🔒</span>`
      : '';
    // Enhancement backlog Phase 2 (PRD §14#9): notes icon + hover preview
    // when this WO has a requester-facing note set.
    const noteIcon = w.note_to_requester
      ? `<span class="note-icon" title="Note to requestor: ${escapeHtml(w.note_to_requester)}" style="margin-right:4px;cursor:help;">📝</span>`
      : '';
    // Enhancement backlog Phase 5 (PRD §14#10): due-date warning flag.
    // Computed client-side from sla_warn_at/sla_deadline against "now"
    // (rather than trusting a server-computed boolean that'd go stale
    // the moment the clock ticks past it) — refreshes whenever the
    // inbox reloads. Not shown for closed WOs; a resolved WO has no
    // pending deadline.
    let deadlineIcon = '';
    if (w.sla_deadline && !w.status.startsWith('Closed')) {
      const nowMs = Date.now();
      if (nowMs >= new Date(w.sla_deadline).getTime()) {
        deadlineIcon = `<span class="deadline-icon" title="Past due — target was ${fmtDateTime(w.sla_deadline)}" style="margin-right:4px;color:#B3261E;cursor:help;">⚠</span>`;
      } else if (w.sla_warn_at && nowMs >= new Date(w.sla_warn_at).getTime()) {
        deadlineIcon = `<span class="deadline-icon" title="Approaching deadline — due ${fmtDateTime(w.sla_deadline)}" style="margin-right:4px;color:#B08900;cursor:help;">⚠</span>`;
      }
    }
    return `
    <tr onclick="openWO(${w.id})" title="${escapeHtml(w.description||'')}">
      <td>${deadlineIcon}${lockIcon}${noteIcon}${w.wo_number}${w.external_ref ? `<div style="font-size:10px;color:var(--ink-soft);">Fiix #${escapeHtml(w.external_ref)}</div>` : ''}</td>
      <td><span class="chip chip-${w.priority}">${w.priority}</span></td>
      <td><span class="status-dot" style="background:${STATUS_COLOR[w.status]||'#999'}"></span>${w.status}</td>
      <td style="white-space:pre-wrap;">${escapeHtml((w.description||'').slice(0,70))}</td>
      <td>${w.asset ? escapeHtml(w.asset.name) : '—'}</td>
      <td>${w.assigned_team ? escapeHtml(w.assigned_team.name) : '—'}</td>
      <td>${fmtDateTime(w.created_at)}</td>
    </tr>`;
  }).join('') || '<tr class="empty-row"><td colspan="7">No work orders match the current filters.</td></tr>';
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function openDrawer(html){
  document.getElementById('drawer').innerHTML = html;
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawerBackdrop').classList.add('open');
}

// Enhancement backlog Phase 1 (PRD §14#2): mark the drawer dirty on any
// field change. Called from oninput/onchange on every editable field.
function markDirty(){ drawerState.dirty = true; }

async function releaseCurrentLock(){
  if (drawerState.editable && drawerState.woId) {
    try { await api(`/work-orders/${drawerState.woId}/unlock`, {method:'POST'}); }
    catch (e) { /* best-effort — a stale lock times out on its own regardless */ }
  }
}

// Enhancement backlog Phase 1 (PRD §14#2) — hotfix (PRD §14#14): this used
// to ask "OK to save, Cancel to discard," which is backwards when the
// user got here by clicking a button literally labeled "Cancel" — they've
// already told us they want to discard, not been asked whether to save.
// Worse, choosing "OK" on that old wording ran saveDrawer(), and if that
// save failed validation (e.g. no location set), the drawer just silently
// stayed open with a toast easy to miss, so it looked like "Cancel doesn't
// work" and needed a second attempt. Now there's exactly one question —
// "discard or keep editing?" — and Save is reached only via the explicit
// Save button, never implicitly through this dialog.
//
// Applies whenever the drawer is closed with unsaved changes (X button,
// backdrop click, Cancel button, or opening a different WO). Also
// releases the edit lock (PRD §14#1) if we held one, so the WO becomes
// available to others immediately rather than waiting out the stale-lock
// timeout.
async function closeDrawer(skipPrompt){
  if (!skipPrompt && drawerState.editable && drawerState.dirty) {
    const wantsDiscard = confirm('Discard your unsaved changes to this work order?');
    if (!wantsDiscard) return; // stay open, exactly as-is — no save attempt, no side effects
  }
  await releaseCurrentLock();
  drawerState = {woId: null, editable: false, dirty: false};
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawerBackdrop').classList.remove('open');
}

function lockBannerHtml(user, at){
  return `<div class="lock-banner" style="background:#fdf3e0;border:1px solid #e8c789;border-radius:6px;padding:8px 10px;font-size:13px;margin-bottom:12px;">
    🔒 Locked by ${escapeHtml(user.name)} since ${fmtTime(at)} — read-only until they save or close.
  </div>`;
}

async function openWO(id){
  // Closing whatever was open before (if anything) releases its lock —
  // skipPrompt=false so unsaved changes on the PREVIOUS wo still prompt.
  if (drawerState.woId && drawerState.woId !== id) {
    await closeDrawer();
    if (drawerState.dirty) return; // user cancelled the save-prompt flow; bail out of opening the new one
  }

  let w;
  try {
    w = await api('/work-orders/' + id);
  } catch (e) {
    if (e.message !== 'session expired') showToast('Could not open work order: ' + e.message, 'err');
    return;
  }

  drawerState = {woId: id, editable: false, dirty: false};
  let lockBanner = '';

  // Enhancement backlog Phase 1 (PRD §14#1): try to claim the edit lock.
  // If someone else already holds it (per the detail we just fetched, or
  // — rare race — discovered only when the lock call itself is rejected),
  // fall back to a read-only view instead of erroring out.
  if (w.locked_by && w.locked_by.id !== CURRENT_USER.id) {
    lockBanner = lockBannerHtml(w.locked_by, w.locked_at);
  } else {
    try {
      await api(`/work-orders/${id}/lock`, {method:'POST'});
      drawerState.editable = true;
    } catch (e) {
      if (e.status === 409) {
        lockBanner = `<div class="lock-banner" style="background:#fdf3e0;border:1px solid #e8c789;border-radius:6px;padding:8px 10px;font-size:13px;margin-bottom:12px;">🔒 ${escapeHtml(e.message)} Viewing read-only.</div>`;
      } else if (e.message !== 'session expired') {
        showToast('Could not lock work order for editing — opening read-only: ' + e.message, 'err');
      }
    }
  }

  renderWODrawer(w, lockBanner);
}

function renderWODrawer(w, lockBanner){
  const editable = drawerState.editable;
  const dis = editable ? '' : 'disabled';
  const teamOpts = TEAMS.map(t=>`<option value="${t.id}" ${w.assigned_team && w.assigned_team.id===t.id?'selected':''}>${escapeHtml(t.name)}</option>`).join('');
  const statusOpts = STATUSES.map(s=>`<option value="${s}" ${w.status===s?'selected':''}>${s}</option>`).join('');
  const priorityOpts = PRIORITIES.map(p=>`<option value="${p}" ${w.priority===p?'selected':''}>${p}</option>`).join('');
  const workTypeOpts = WORK_TYPES.map(t=>`<option value="${t}" ${w.work_type===t?'selected':''}>${t}</option>`).join('')
    + `<option value="" ${!w.work_type?'selected':''}>Other / blank</option>`;
  // Enhancement backlog Phase 3 (PRD §14#15): show who wrote each note,
  // not just its type and timestamp. author is null for system-authored
  // notes (rare, but possible), so this degrades gracefully.
  const notesHtml = (w.notes||[]).slice().reverse().map(n=>`<div class="note">${escapeHtml(n.note_text)}<div class="meta">${n.note_type}${n.author ? ' · ' + escapeHtml(n.author.name) : ''} · ${fmtDateTime(n.created_at)}</div></div>`).join('') || '<p style="font-size:12px;color:var(--ink-soft);">No notes yet.</p>';
  // Enhancement backlog Phase 1 (PRD §14#4, bundled in alongside the
  // Phase 1 items since the data was already one property away): show
  // who made each change, not just a bare event line.
  const histHtml = (w.history||[]).slice().reverse().map(h=>`<div class="hist">${h.event_type}: ${h.from_value||'—'} → ${h.to_value}${h.changed_by_name ? ' · ' + escapeHtml(h.changed_by_name) : ''} (${fmtDateTime(h.changed_at)})</div>`).join('');
  // Enhancement backlog Phase 10 (PRD §13#9): attachments can now be PDFs,
  // not just photos — render those as a small file-link tile instead of
  // an <img> (which would just show as broken for a non-image file).
  const attachmentsHtml = (w.attachments||[]).length
    ? `<div style="display:flex;gap:8px;flex-wrap:wrap;">` + (w.attachments||[]).map(a => {
        const isPdf = /\.pdf($|\?)/i.test(a.file_url);
        return isPdf
          ? `<a href="${a.file_url}" target="_blank" rel="noopener" style="width:72px;height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:6px;border:1px solid var(--khaki-line);background:#f4f1e8;font-size:10px;color:var(--ink-soft);text-decoration:none;">📄<span>PDF</span></a>`
          : `<a href="${a.file_url}" target="_blank" rel="noopener"><img src="${a.file_url}" alt="attachment" style="width:72px;height:72px;object-fit:cover;border-radius:6px;border:1px solid var(--khaki-line);"></a>`;
      }).join('') + `</div>`
    : '';
  // Enhancement backlog Phase 1 (PRD §14#3, same "already have the data"
  // rationale as history above): POC block at the top when the requester
  // isn't the point of contact.
  const pocHtml = (!w.poc_is_requester && (w.poc_name || w.poc_phone))
    ? `<p style="font-size:12px;color:var(--ink-soft);margin:2px 0 0;"><strong>POC:</strong> ${escapeHtml(w.poc_name||'')} ${escapeHtml(w.poc_phone||'')}</p>`
    : '';

  // Enhancement backlog Phase 3 (PRD §14#12): plain-text summary shown
  // only when printing (see the .print-only / @media print CSS) — the
  // editable form controls above get hidden on print instead, since a
  // printed textarea/select just shows an empty box, not its value.
  const printOnlyHtml = `
    <div class="print-only">
      <p><strong>Location:</strong> ${escapeHtml(w.asset ? w.asset.name : '—')}</p>
      <p><strong>Work type:</strong> ${escapeHtml(w.work_type || '—')} &nbsp; <strong>Priority:</strong> ${escapeHtml(w.priority)}</p>
      <p><strong>Status:</strong> ${escapeHtml(w.status)} &nbsp; <strong>Team:</strong> ${escapeHtml(w.assigned_team ? w.assigned_team.name : '—')}</p>
      <p><strong>Description:</strong><br>${escapeHtml(w.description)}</p>
      ${w.note_to_requester ? `<p><strong>Note to requestor:</strong><br>${escapeHtml(w.note_to_requester)}</p>` : ''}
      <p style="font-size:11px;color:#666;">Printed ${fmtDateTime(new Date().toISOString())}</p>
    </div>`;

  openDrawer(`
    <button class="close-btn" onclick="closeDrawer()">×</button>
    <h2>${w.wo_number}${w.external_ref ? ` <span style="font-size:12px;font-weight:400;color:var(--ink-soft);">(Fiix #${escapeHtml(w.external_ref)})</span>` : ''}</h2>
    <p style="font-size:12px;color:var(--ink-soft);margin-top:0;">${escapeHtml(w.requester_name)} · ${escapeHtml(w.requester_email||'')} ${escapeHtml(w.requester_phone||'')}${w.notify_preference ? ' · prefers ' + escapeHtml(w.notify_preference) : ''}</p>
    ${pocHtml}
    ${lockBanner}
    ${attachmentsHtml}
    ${printOnlyHtml}

    <div class="drawer-group">
      <label>Description</label>
      <textarea id="dDescription" oninput="markDirty()" ${dis}>${escapeHtml(w.description)}</textarea>
      <label>Location / asset</label>
      ${editable ? `<div id="dLocationPicker"></div>` : `<p style="margin:4px 0;">${escapeHtml(w.asset ? w.asset.name : '—')}</p>`}
      <label>Work type</label>
      <select id="dWorkType" onchange="markDirty()" ${dis}>${workTypeOpts}</select>
      <label>Priority</label>
      <select id="dPriority" onchange="markDirty()" ${dis}>${priorityOpts}</select>
    </div>

    <div class="drawer-group">
      <label>Status</label>
      <select id="dStatus" onchange="markDirty()" ${dis}>${statusOpts}</select>
      <label>Status note (recommended when closing)</label>
      <textarea id="dStatusNote" placeholder="What happened…" oninput="markDirty()" ${dis}></textarea>
    </div>

    <div class="drawer-group">
      <label>Assign to team</label>
      <select id="dTeam" onchange="markDirty()" ${dis}>${teamOpts}</select>
      <label>Reason (required if reassigning to a different team)</label>
      <textarea id="dAssignNote" placeholder="Why is this moving teams…" oninput="markDirty()" ${dis}></textarea>
      <div class="field-err" id="dAssignErr"></div>
    </div>

    <div class="drawer-group">
      <!-- Enhancement backlog Phase 1 (PRD §14#5) -->
      <label>Note to requestor <span style="font-weight:400;color:var(--ink-soft);">(visible to the requester when they check status)</span></label>
      <textarea id="dNoteToRequester" placeholder="e.g. \u201cA tech is on the way, ETA 30 min.\u201d" oninput="markDirty()" ${dis}>${escapeHtml(w.note_to_requester||'')}</textarea>
    </div>

    <div class="drawer-group">
      <label>Add an internal note</label>
      <textarea id="dNote" placeholder="Add a note…" oninput="markDirty()" ${dis}></textarea>
    </div>

    <!-- Enhancement backlog Phase 1 (PRD §14#2): one Save action for
         everything in the drawer, instead of one per section. -->
    <div class="drawer-actions" style="margin-top:8px;">
      ${editable
        ? `<button class="btn" id="saveDrawerBtn" onclick="saveDrawer()">Save changes</button>
           <button class="btn btn-ghost" onclick="closeDrawer()">Cancel</button>`
        : `<button class="btn btn-ghost" onclick="closeDrawer()">Close</button>`}
      <button class="btn btn-ghost" onclick="window.print()">Print / Save as PDF</button>
    </div>

    <div class="section-title" style="margin-top:22px;">Notes</div>
    ${notesHtml}
    <div class="section-title">Status history</div>
    ${histHtml}
  `);

  drawerLocationPicker = editable ? LocationPicker.mount(document.getElementById('dLocationPicker'), {
    treeUrl: '/locations/tree',
    fetchOpts: { headers: { Authorization: 'Bearer ' + TOKEN } },
    initial: w.asset ? { id: w.asset.id, name: w.asset.name } : null,
    placeholder: 'Search or browse locations…',
    onChange: markDirty,
  }) : null;
  // Read-only view still needs the WO's own asset id for... nothing,
  // actually — saveDrawer() is unreachable when !editable (no Save
  // button is rendered), so there's nothing to fall back to here.
}

// Enhancement backlog Phase 1 (PRD §14#2): single Save, one request,
// one transaction on the backend (crud.save_work_order). Returns true on
// success, false on failure, so closeDrawer()'s save-prompt flow knows
// whether it's safe to actually close.
async function saveDrawer(){
  const id = drawerState.woId;
  const btn = document.getElementById('saveDrawerBtn');
  document.getElementById('dAssignErr').textContent = '';
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }

  const assetId = drawerLocationPicker ? drawerLocationPicker.getValue() : null;
  if (!assetId) {
    showToast('Choose a location before saving.', 'err');
    if (btn) { btn.disabled = false; btn.textContent = 'Save changes'; }
    return false;
  }

  const payload = {
    description: document.getElementById('dDescription').value,
    asset_id: assetId,
    work_type: document.getElementById('dWorkType').value,
    priority: document.getElementById('dPriority').value,
    note_to_requester: document.getElementById('dNoteToRequester').value,
    status: document.getElementById('dStatus').value,
    status_note: document.getElementById('dStatusNote').value || null,
    team_id: parseInt(document.getElementById('dTeam').value),
    assign_note: document.getElementById('dAssignNote').value || null,
    new_note_text: document.getElementById('dNote').value || null,
    new_note_type: 'internal',
  };

  try {
    await api(`/work-orders/${id}/save`, {method:'POST', body:payload});
    showToast('Work order saved.', 'ok');
    drawerState.dirty = false;
    drawerState.editable = false; // /save already released the lock server-side
    document.getElementById('drawer').classList.remove('open');
    document.getElementById('drawerBackdrop').classList.remove('open');
    drawerState = {woId: null, editable: false, dirty: false};
    load();
    return true;
  } catch (e) {
    if (e.status === 400 && /reason note is required/i.test(e.message)) {
      document.getElementById('dAssignErr').textContent = e.message;
    } else if (e.message !== 'session expired') {
      showToast('Could not save: ' + e.message, 'err');
    }
    if (btn) { btn.disabled = false; btn.textContent = 'Save changes'; }
    return false;
  }
}

function openNewWO(){
  const priorityOpts = PRIORITIES.map(p=>`<option value="${p}">${p}</option>`).join('');
  openDrawer(`
    <button class="close-btn" onclick="closeDrawer()">×</button>
    <h2>New Work Order</h2>
    <label>Requester name</label><input id="nName">
    <label>Requester email</label><input id="nEmail" type="email">
    <label>Requester phone</label><input id="nPhone">
    <label>Location / asset</label><div id="nLocationPicker"></div>
    <label>Work type</label>
    <select id="nType">
      <option value="NJ Maintenance">NJ Maintenance</option>
      <option value="NJ IT">NJ IT</option>
      <option value="NJ Items/Parts">NJ Items/Parts</option>
      <option value="NJ Transportation">NJ Transportation</option>
      <option value="">Other / blank</option>
    </select>
    <label>Priority</label><select id="nPriority">${priorityOpts}</select>
    <label>Description</label><textarea id="nDesc"></textarea>
    <div class="field-err" id="nErr"></div>
    <div class="drawer-actions"><button class="btn" onclick="createWO()">Create work order</button></div>
  `);
  newWoLocationPicker = LocationPicker.mount(document.getElementById('nLocationPicker'), {
    treeUrl: '/locations/tree',
    fetchOpts: { headers: { Authorization: 'Bearer ' + TOKEN } },
    placeholder: 'Search or browse locations…',
  });
}

async function createWO(){
  const btn = event.target;
  const errEl = document.getElementById('nErr');
  errEl.textContent = '';
  const name = document.getElementById('nName').value.trim();
  const desc = document.getElementById('nDesc').value.trim();
  const assetId = newWoLocationPicker ? newWoLocationPicker.getValue() : null;
  if (!name || !desc) { errEl.textContent = 'Requester name and description are required.'; return; }
  if (!assetId) { errEl.textContent = 'Choose a location.'; return; }
  await withButtonLock(btn, async () => {
    const payload = {
      requester_name: name,
      requester_email: document.getElementById('nEmail').value || null,
      requester_phone: document.getElementById('nPhone').value || null,
      asset_id: assetId,
      work_type: document.getElementById('nType').value,
      priority: document.getElementById('nPriority').value,
      description: desc,
    };
    try {
      const created = await api('/work-orders', {method:'POST', body:payload});
      showToast(`Created ${created.wo_number}.`, 'ok');
      closeDrawer(); load();
    } catch (e) {
      if (e.message !== 'session expired') errEl.textContent = e.message;
    }
  });
}

// Enhancement backlog Phase 1 (PRD §14#2): best-effort warning on tab
// close/refresh with unsaved changes. Doesn't release the lock here —
// browsers don't reliably run async code in beforeunload — so a closed
// tab relies on the stale-lock timeout (models.LOCK_TIMEOUT_MINUTES) to
// free the WO back up, same as a crashed browser would.
window.addEventListener('beforeunload', (e) => {
  if (drawerState.editable && drawerState.dirty) {
    e.preventDefault();
    e.returnValue = '';
  }
});

if (TOKEN) boot();
</script>
