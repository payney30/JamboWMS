<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOC Triage — National Jamboree Work Orders</title>
<style>
:root{
  --pine:#1C3829;
  --pine-deep:#122A1D;
  --canvas:#EFEADC;
  --canvas-panel:#FBF8F0;
  --khaki-line:#D8CFB6;
  --ink:#241F14;
  --ink-soft:#5B5340;
  --hivis:#E8620C;
  --hivis-soft:#F4A25E;
  --amber:#C9962B;
  --olive:#5C7A4A;
  --moss:#3E6B4F;
  --slate:#5A7385;
  --closed:#7A8471;
  --danger-bg:#FBE4D6;
  --ok-bg:#E4EEE0;
  --font-display: 'Oswald', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'SF Mono', 'Consolas', 'Menlo', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--canvas);color:var(--ink);font-family:var(--font-body);}
.wrap{max-width:1280px;margin:0 auto;padding:28px 24px 60px;}
.topbar{background:var(--pine);color:var(--canvas-panel);border-radius:10px;padding:20px 26px;
  display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 0 var(--pine-deep);flex-wrap:wrap;gap:10px;}
.brand-eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--hivis-soft);margin:0 0 4px;}
.brand-title{font-family:var(--font-display);font-weight:600;font-size:26px;letter-spacing:.01em;margin:0;text-transform:uppercase;}
#loginBox{background:var(--canvas-panel);border:1px solid var(--khaki-line);border-radius:10px;padding:24px;max-width:360px;margin:60px auto;}
#loginBox input{width:100%;padding:10px;margin:6px 0 14px;border:1px solid var(--khaki-line);border-radius:6px;font-size:14px;}
#loginBox button, .btn{background:var(--pine);color:#fff;border:none;border-radius:6px;padding:10px 16px;font-size:13px;cursor:pointer;font-family:var(--font-body);}
#loginBox button:hover, .btn:hover{background:var(--pine-deep);}
.btn:disabled{opacity:.55;cursor:not-allowed;}
.btn-ghost{background:transparent;color:var(--pine);border:1px solid var(--pine);}
.btn-ghost:hover{background:var(--pine);color:#fff;}
#loginErr{color:var(--hivis);font-size:12px;min-height:16px;}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:18px;}
.kpi{background:var(--canvas-panel);border:1px solid var(--khaki-line);border-radius:8px;padding:14px 16px;position:relative;}
.kpi.clickable{cursor:pointer;}
.kpi.clickable:hover{border-color:var(--pine);}
.kpi.active{border-color:var(--pine);border-width:2px;background:var(--ok-bg);}
.kpi .num{font-family:var(--font-display);font-size:26px;font-weight:600;line-height:1;}
.kpi .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin-top:6px;}
th.sortable{cursor:pointer;user-select:none;white-space:nowrap;}
th.sortable:hover{color:var(--pine);}
.sort-icon{font-size:9px;opacity:.45;margin-left:3px;}
.sort-icon.active{opacity:1;color:var(--pine);}

.section-title{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.06em;font-size:13px;color:var(--ink-soft);margin:26px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.section-title .hint{font-family:var(--font-body);text-transform:none;letter-spacing:normal;font-size:11px;color:var(--ink-soft);opacity:.75;}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.filters select,.filters input{padding:8px 10px;border:1px solid var(--khaki-line);border-radius:6px;font-size:13px;background:var(--canvas-panel);}
.filters input{flex:1;min-width:180px;}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px;}
.chip-btn{background:var(--canvas-panel);border:1px solid var(--khaki-line);border-radius:20px;padding:5px 12px;font-size:12px;cursor:pointer;color:var(--ink-soft);}
.chip-btn:hover{border-color:var(--pine);color:var(--pine);}
.chip-btn.active{background:var(--pine);border-color:var(--pine);color:#fff;}

table{width:100%;border-collapse:collapse;background:var(--canvas-panel);border:1px solid var(--khaki-line);border-radius:8px;overflow:hidden;font-size:13px;}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--khaki-line);}
th{background:#F1EDDF;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);}
tr:hover td{background:#F5F1E4;cursor:pointer;}
.chip{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
.chip-Highest,.chip-High{background:var(--danger-bg);color:var(--hivis);}
.chip-Medium{background:#FBF0D6;color:var(--amber);}
.chip-Low,.chip-Lowest{background:#E7E4DC;color:var(--ink-soft);}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;}
.empty-row td{color:var(--ink-soft);text-align:center;padding:22px 12px;}
.loading-row td{color:var(--ink-soft);text-align:center;padding:22px 12px;font-family:var(--font-mono);font-size:12px;}

#drawer{position:fixed;top:0;right:-460px;width:440px;height:100%;background:var(--canvas-panel);
  border-left:1px solid var(--khaki-line);box-shadow:-6px 0 20px rgba(0,0,0,.15);transition:right .2s;overflow-y:auto;padding:24px;z-index:10;}
#drawer.open{right:0;}
#drawerBackdrop{position:fixed;inset:0;background:rgba(0,0,0,.25);display:none;z-index:9;}
#drawerBackdrop.open{display:block;}
#drawer h2{font-family:var(--font-display);font-size:18px;margin:0 0 4px;}
#drawer label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin:14px 0 4px;}
#drawer select,#drawer textarea,#drawer input{width:100%;padding:8px;border:1px solid var(--khaki-line);border-radius:6px;font-size:13px;font-family:var(--font-body);}
#drawer textarea{min-height:60px;}
.close-btn{position:absolute;top:18px;right:18px;background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink-soft);}
.note{background:#F1EDDF;border-radius:6px;padding:8px 10px;margin:6px 0;font-size:12px;}
.note .meta{color:var(--ink-soft);font-size:10px;margin-top:3px;}
.hist{font-size:11px;color:var(--ink-soft);padding:4px 0;border-bottom:1px dashed var(--khaki-line);}
.drawer-group{border-top:1px dashed var(--khaki-line);padding-top:14px;margin-top:14px;}
.drawer-group:first-of-type{border-top:none;margin-top:0;padding-top:0;}
.drawer-actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;}
.field-err{color:var(--hivis);font-size:11px;margin-top:4px;min-height:14px;}

#toastStack{position:fixed;bottom:20px;right:20px;z-index:50;display:flex;flex-direction:column;gap:8px;max-width:340px;}
.toast{background:var(--pine);color:#fff;border-radius:8px;padding:10px 14px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.2);}
.toast.err{background:var(--hivis);}
.toast.ok{background:var(--moss);}
</style>
</head>
<body>

<div id="loginBox">
  <h2 style="font-family:var(--font-display);margin-top:0;">LOC Triage Login</h2>
  <label>Email</label><input id="loginEmail" type="email" autocomplete="username">
  <label>Password</label><input id="loginPass" type="password" autocomplete="current-password">
  <button onclick="login()">Sign in</button>
  <div id="loginErr"></div>
</div>

<div class="wrap" id="app" style="display:none;">
  <div class="topbar">
    <div>
      <p class="brand-eyebrow">Live &middot; National Jamboree Work Orders</p>
      <h1 class="brand-title">LOC Triage</h1>
    </div>
    <button class="btn" onclick="logout()">Sign out</button>
  </div>

  <div class="kpis" id="kpiRow"></div>

  <div class="section-title">
    <span>Filter</span>
    <span class="hint" id="sortHint">Inbox sorted by priority, then oldest first</span>
  </div>
  <div class="filters">
    <select id="fStatus" onchange="load()"><option value="">All Statuses</option></select>
    <select id="fPriority" onchange="load()"><option value="">All Priorities</option></select>
    <select id="fWorkType" onchange="load()"><option value="">All Work Types</option></select>
    <select id="fLocation" onchange="load()"><option value="">All Locations</option></select>
    <select id="fTeam" onchange="load()"><option value="">All Teams</option></select>
    <input id="fSearch" placeholder="Search description or WO#…" oninput="debouncedLoad()">
    <button class="btn btn-ghost" onclick="clearFilters()">Clear filters</button>
    <button class="btn" onclick="openNewWO()">+ New WO</button>
  </div>
  <div class="chips" id="quickViews"></div>

  <div class="section-title">Inbox</div>
  <table>
    <thead><tr>
      <th class="sortable" onclick="setSort('wo_number')">WO# <span class="sort-icon" id="sortIcon-wo_number"></span></th>
      <th class="sortable" onclick="setSort('priority')">Priority <span class="sort-icon" id="sortIcon-priority"></span></th>
      <th class="sortable" onclick="setSort('status')">Status <span class="sort-icon" id="sortIcon-status"></span></th>
      <th>Description</th>
      <th class="sortable" onclick="setSort('location')">Location <span class="sort-icon" id="sortIcon-location"></span></th>
      <th class="sortable" onclick="setSort('team')">Team <span class="sort-icon" id="sortIcon-team"></span></th>
      <th class="sortable" onclick="setSort('created')">Created <span class="sort-icon" id="sortIcon-created"></span></th>
    </tr></thead>
    <tbody id="woTableBody"><tr class="loading-row"><td colspan="7">Loading…</td></tr></tbody>
  </table>
</div>

<div id="drawerBackdrop" onclick="closeDrawer()"></div>
<div id="drawer"></div>
<div id="toastStack"></div>

<script src="location-picker.js"></script>
<script>
const API = '';
let TOKEN = localStorage.getItem('loc_token') || '';
let TEAMS = [], ASSETS = [];
let drawerLocationPicker = null, newWoLocationPicker = null;
let activeQuickView = '';
let currentSort = {key: null, dir: 'asc'};
let LAST_WOS = [];
const PRIORITY_ORDER = {"Highest":0,"High":1,"Medium":2,"Low":3,"Lowest":4};
const STATUSES = ["Requested","Assigned","Work In Progress","On Hold","Closed, Completed","Closed, Incomplete"];
const PRIORITIES = ["Highest","High","Medium","Low","Lowest"];
const WORK_TYPES = ["NJ Maintenance","NJ IT","NJ Items/Parts","NJ Transportation"];
const STATUS_COLOR = {"Requested":"#C9962B","Assigned":"#3E6B4F","Work In Progress":"#E8620C","On Hold":"#5A7385","Closed, Completed":"#7A8471","Closed, Incomplete":"#7A8471"};
const QUICK_VIEWS = [
  {key:'', label:'All'},
  {key:'Requested', label:'Requested'},
  {key:'Assigned', label:'Assigned'},
  {key:'Work In Progress', label:'In Progress'},
  {key:'On Hold', label:'On Hold'},
  {key:'HighestHighOpen', label:'Highest + High, open'},
  {key:'Closed', label:'Closed'},
];

function showToast(msg, kind){
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.textContent = msg;
  document.getElementById('toastStack').appendChild(el);
  setTimeout(() => el.remove(), 5000);
}

async function api(path, opts={}) {
  opts.headers = Object.assign({}, opts.headers, TOKEN ? {Authorization: 'Bearer ' + TOKEN} : {});
  if (opts.body && !(opts.body instanceof URLSearchParams)) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(opts.body);
  }
  let res;
  try {
    res = await fetch(API + path, opts);
  } catch (e) {
    throw new Error('Network error — check your connection and try again.');
  }
  if (res.status === 401 && path !== '/auth/login') {
    localStorage.removeItem('loc_token');
    TOKEN = '';
    document.getElementById('app').style.display = 'none';
    document.getElementById('loginBox').style.display = 'block';
    document.getElementById('loginErr').textContent = 'Your session expired — please sign in again.';
    throw new Error('session expired');
  }
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).detail || detail; } catch (e) {}
    const err = new Error(detail);
    err.status = res.status;
    throw err;
  }
  return res.status === 204 ? null : res.json();
}

async function login() {
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginErr');
  errEl.textContent = '';
  if (!email || !pass) { errEl.textContent = 'Enter both an email and a password.'; return; }
  const body = new URLSearchParams({username: email, password: pass});
  try {
    const data = await api('/auth/login', {method:'POST', body});
    TOKEN = data.access_token;
    localStorage.setItem('loc_token', TOKEN);
    await boot();
  } catch(e) {
    errEl.textContent = e.status === 429 ? e.message : (e.message || 'Sign-in failed.');
  }
}
function logout(){ localStorage.removeItem('loc_token'); TOKEN=''; location.reload(); }

async function boot() {
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  try {
    TEAMS = await api('/teams');
    ASSETS = await api('/assets');
  } catch (e) {
    showToast('Could not load reference data: ' + e.message, 'err');
    return;
  }
  populateFilterOptions();
  renderQuickViews();
  await load();
}

function populateFilterOptions(){
  const fStatus = document.getElementById('fStatus');
  STATUSES.forEach(s => fStatus.insertAdjacentHTML('beforeend', `<option value="${s}">${s}</option>`));
  const fPriority = document.getElementById('fPriority');
  PRIORITIES.forEach(p => fPriority.insertAdjacentHTML('beforeend', `<option value="${p}">${p}</option>`));
  const fWorkType = document.getElementById('fWorkType');
  WORK_TYPES.forEach(w => fWorkType.insertAdjacentHTML('beforeend', `<option value="${w}">${w}</option>`));
  const fTeam = document.getElementById('fTeam');
  TEAMS.forEach(t => fTeam.insertAdjacentHTML('beforeend', `<option value="${t.id}">${t.name}</option>`));
  const fLocation = document.getElementById('fLocation');
  const locations = Array.from(new Set(ASSETS.map(a => a.location_group))).sort();
  locations.forEach(l => fLocation.insertAdjacentHTML('beforeend', `<option value="${l}">${l}</option>`));
}

function renderQuickViews(){
  document.getElementById('quickViews').innerHTML = QUICK_VIEWS.map(v =>
    `<button class="chip-btn ${activeQuickView===v.key?'active':''}" onclick="applyQuickView('${v.key}')">${v.label}</button>`
  ).join('');
}

function applyQuickView(key){
  activeQuickView = key;
  renderQuickViews();
  if (['','HighestHighOpen','Closed','OpenActive','OpenedToday','ClosedToday'].includes(key)) {
    document.getElementById('fStatus').value = '';
    document.getElementById('fPriority').value = '';
  } else {
    document.getElementById('fStatus').value = key;
    document.getElementById('fPriority').value = '';
  }
  load();
}

function clearFilters(){
  ['fStatus','fPriority','fWorkType','fLocation','fTeam'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fSearch').value = '';
  activeQuickView = '';
  renderQuickViews();
  load();
}

let debounceTimer;
function debouncedLoad(){ clearTimeout(debounceTimer); debounceTimer = setTimeout(load, 300); }

async function load() {
  document.getElementById('woTableBody').innerHTML = '<tr class="loading-row"><td colspan="7">Loading…</td></tr>';

  const params = new URLSearchParams();
  const status = document.getElementById('fStatus').value;
  const priority = document.getElementById('fPriority').value;
  const workType = document.getElementById('fWorkType').value;
  const location = document.getElementById('fLocation').value;
  const team = document.getElementById('fTeam').value;
  const search = document.getElementById('fSearch').value;
  const needsClientFilter = ['HighestHighOpen','Closed','OpenActive','OpenedToday','ClosedToday'].includes(activeQuickView);
  if (!needsClientFilter && status) params.set('status', status);
  if (priority) params.set('priority', priority);
  if (workType) params.set('work_type', workType);
  if (location) params.set('location_group', location);
  if (team) params.set('team_id', team);
  if (search) params.set('search', search);
  params.set('limit', '200');

  let wos, kpis;
  try {
    [wos, kpis] = await Promise.all([
      api('/work-orders?' + params.toString()),
      api('/dashboard/kpis'),
    ]);
  } catch (e) {
    if (e.message !== 'session expired') showToast('Could not load work orders: ' + e.message, 'err');
    document.getElementById('woTableBody').innerHTML = '<tr class="empty-row"><td colspan="7">Could not load work orders.</td></tr>';
    return;
  }

  const isToday = (isoString) => isoString && new Date(isoString).toDateString() === new Date().toDateString();

  if (activeQuickView === 'HighestHighOpen') {
    wos = wos.filter(w => (w.priority === 'Highest' || w.priority === 'High') && !w.status.startsWith('Closed'));
  } else if (activeQuickView === 'Closed') {
    wos = wos.filter(w => w.status.startsWith('Closed'));
  } else if (activeQuickView === 'OpenActive') {
    wos = wos.filter(w => !w.status.startsWith('Closed'));
  } else if (activeQuickView === 'OpenedToday') {
    wos = wos.filter(w => isToday(w.created_at));
  } else if (activeQuickView === 'ClosedToday') {
    wos = wos.filter(w => w.status.startsWith('Closed') && isToday(w.closed_at));
  }

  LAST_WOS = wos;
  renderKPIs(kpis);
  renderTable(sortWOs(wos));
}

function sortValue(w, key){
  switch(key){
    case 'wo_number': return w.wo_number || '';
    case 'priority': return PRIORITY_ORDER[w.priority] ?? 99;
    case 'status': return w.status || '';
    case 'location': return (w.asset ? w.asset.name : '') || '';
    case 'team': return (w.assigned_team ? w.assigned_team.name : '') || '';
    case 'created': return new Date(w.created_at).getTime();
    default: return '';
  }
}

function sortWOs(wos){
  if (!currentSort.key) return wos; // server default: priority, then oldest first
  const dir = currentSort.dir === 'asc' ? 1 : -1;
  return [...wos].sort((a, b) => {
    const av = sortValue(a, currentSort.key), bv = sortValue(b, currentSort.key);
    if (av < bv) return -1 * dir;
    if (av > bv) return 1 * dir;
    return 0;
  });
}

function setSort(key){
  if (currentSort.key === key) {
    currentSort.dir = currentSort.dir === 'asc' ? 'desc' : 'asc';
  } else {
    currentSort = {key, dir: 'asc'};
  }
  document.querySelectorAll('.sort-icon').forEach(el => { el.textContent = ''; el.classList.remove('active'); });
  const icon = document.getElementById('sortIcon-' + key);
  icon.textContent = currentSort.dir === 'asc' ? '▲' : '▼';
  icon.classList.add('active');
  const labels = {wo_number:'WO#', priority:'Priority', status:'Status', location:'Location', team:'Team', created:'Created'};
  document.getElementById('sortHint').textContent = `Sorted by ${labels[key]} (${currentSort.dir === 'asc' ? 'ascending' : 'descending'})`;
  renderTable(sortWOs(LAST_WOS));
}

function renderKPIs(k){
  const items = [
    {num:k.total, lbl:'Total', key:''},
    {num:k.open, lbl:'Open / Active', key:'OpenActive'},
    {num:k.highest_high_open, lbl:'Highest+High Open', key:'HighestHighOpen'},
    {num:k.closed, lbl:'Closed', key:'Closed'},
    {num:k.completion_rate+'%', lbl:'Completion Rate', key:null},
    {num:k.opened_today, lbl:'Opened Today', key:'OpenedToday'},
    {num:k.closed_today, lbl:'Closed Today', key:'ClosedToday'},
  ];
  document.getElementById('kpiRow').innerHTML = items.map(i => {
    const clickable = i.key !== null;
    const active = clickable && activeQuickView === i.key;
    return `<div class="kpi ${clickable ? 'clickable' : ''} ${active ? 'active' : ''}"
      ${clickable ? `onclick="applyQuickView('${i.key}')"` : ''}>
      <div class="num">${i.num}</div><div class="lbl">${i.lbl}</div>
    </div>`;
  }).join('');
}

function renderTable(wos){
  document.getElementById('woTableBody').innerHTML = wos.map(w => `
    <tr onclick="openWO(${w.id})">
      <td>${w.wo_number}${w.external_ref ? `<div style="font-size:10px;color:var(--ink-soft);">Fiix #${escapeHtml(w.external_ref)}</div>` : ''}</td>
      <td><span class="chip chip-${w.priority}">${w.priority}</span></td>
      <td><span class="status-dot" style="background:${STATUS_COLOR[w.status]||'#999'}"></span>${w.status}</td>
      <td>${escapeHtml((w.description||'').slice(0,70))}</td>
      <td>${w.asset ? escapeHtml(w.asset.name) : '—'}</td>
      <td>${w.assigned_team ? escapeHtml(w.assigned_team.name) : '—'}</td>
      <td>${new Date(w.created_at).toLocaleString()}</td>
    </tr>`).join('') || '<tr class="empty-row"><td colspan="7">No work orders match the current filters.</td></tr>';
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function openDrawer(html){
  document.getElementById('drawer').innerHTML = html;
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawerBackdrop').classList.add('open');
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawerBackdrop').classList.remove('open');
}

async function openWO(id){
  let w;
  try {
    w = await api('/work-orders/' + id);
  } catch (e) {
    if (e.message !== 'session expired') showToast('Could not open work order: ' + e.message, 'err');
    return;
  }
  const teamOpts = TEAMS.map(t=>`<option value="${t.id}" ${w.assigned_team && w.assigned_team.id===t.id?'selected':''}>${escapeHtml(t.name)}</option>`).join('');
  const statusOpts = STATUSES.map(s=>`<option value="${s}" ${w.status===s?'selected':''}>${s}</option>`).join('');
  const priorityOpts = PRIORITIES.map(p=>`<option value="${p}" ${w.priority===p?'selected':''}>${p}</option>`).join('');
  const workTypeOpts = WORK_TYPES.map(t=>`<option value="${t}" ${w.work_type===t?'selected':''}>${t}</option>`).join('')
    + `<option value="" ${!w.work_type?'selected':''}>Other / blank</option>`;
  const notesHtml = (w.notes||[]).slice().reverse().map(n=>`<div class="note">${escapeHtml(n.note_text)}<div class="meta">${n.note_type} · ${new Date(n.created_at).toLocaleString()}</div></div>`).join('') || '<p style="font-size:12px;color:var(--ink-soft);">No notes yet.</p>';
  const histHtml = (w.history||[]).slice().reverse().map(h=>`<div class="hist">${h.event_type}: ${h.from_value||'—'} → ${h.to_value} (${new Date(h.changed_at).toLocaleString()})</div>`).join('');
  const attachmentsHtml = (w.attachments||[]).length
    ? `<div style="display:flex;gap:8px;flex-wrap:wrap;">` + (w.attachments||[]).map(a =>
        `<a href="${a.file_url}" target="_blank" rel="noopener"><img src="${a.file_url}" alt="attachment" style="width:72px;height:72px;object-fit:cover;border-radius:6px;border:1px solid var(--khaki-line);"></a>`
      ).join('') + `</div>`
    : '';

  openDrawer(`
    <button class="close-btn" onclick="closeDrawer()">×</button>
    <h2>${w.wo_number}${w.external_ref ? ` <span style="font-size:12px;font-weight:400;color:var(--ink-soft);">(Fiix #${escapeHtml(w.external_ref)})</span>` : ''}</h2>
    <p style="font-size:12px;color:var(--ink-soft);margin-top:0;">${escapeHtml(w.requester_name)} · ${escapeHtml(w.requester_email||'')} ${escapeHtml(w.requester_phone||'')}${w.notify_preference ? ' · prefers ' + escapeHtml(w.notify_preference) : ''}</p>
    ${attachmentsHtml}

    <div class="drawer-group">
      <label>Description</label>
      <textarea id="dDescription">${escapeHtml(w.description)}</textarea>
      <label>Location / asset</label>
      <div id="dLocationPicker"></div>
      <label>Work type</label>
      <select id="dWorkType">${workTypeOpts}</select>
      <label>Priority</label>
      <select id="dPriority">${priorityOpts}</select>
      <div class="drawer-actions">
        <button class="btn" onclick="saveDetails(${w.id})">Save details</button>
      </div>
    </div>

    <div class="drawer-group">
      <label>Status</label>
      <select id="dStatus">${statusOpts}</select>
      <label>Status note (recommended when closing)</label>
      <textarea id="dStatusNote" placeholder="What happened…"></textarea>
      <div class="drawer-actions">
        <button class="btn" onclick="saveStatus(${w.id})">Update status</button>
      </div>
    </div>

    <div class="drawer-group">
      <label>Assign to team</label>
      <select id="dTeam">${teamOpts}</select>
      <label>Reason (required if reassigning to a different team)</label>
      <textarea id="dAssignNote" placeholder="Why is this moving teams…"></textarea>
      <div class="field-err" id="dAssignErr"></div>
      <div class="drawer-actions">
        <button class="btn" onclick="saveAssign(${w.id})">Assign / reassign</button>
      </div>
    </div>

    <div class="drawer-group">
      <label>Add a note</label>
      <textarea id="dNote" placeholder="Add a note…"></textarea>
      <div class="drawer-actions">
        <button class="btn" onclick="saveNote(${w.id})">Add note</button>
      </div>
    </div>

    <div class="section-title" style="margin-top:22px;">Notes</div>
    ${notesHtml}
    <div class="section-title">Status history</div>
    ${histHtml}
  `);

  drawerLocationPicker = LocationPicker.mount(document.getElementById('dLocationPicker'), {
    treeUrl: '/locations/tree',
    fetchOpts: { headers: { Authorization: 'Bearer ' + TOKEN } },
    initial: w.asset ? { id: w.asset.id, name: w.asset.name } : null,
    placeholder: 'Search or browse locations…',
  });
}

async function withButtonLock(btn, fn){
  if (!btn) { await fn(); return; }
  btn.disabled = true;
  const original = btn.textContent;
  try {
    await fn();
  } finally {
    btn.disabled = false;
    btn.textContent = original;
  }
}

async function saveDetails(id){
  const btn = event.target;
  await withButtonLock(btn, async () => {
    const assetId = drawerLocationPicker ? drawerLocationPicker.getValue() : null;
    if (!assetId) { showToast('Choose a location before saving.', 'err'); return; }
    const payload = {
      description: document.getElementById('dDescription').value,
      asset_id: assetId,
      work_type: document.getElementById('dWorkType').value,
      priority: document.getElementById('dPriority').value,
    };
    try {
      await api(`/work-orders/${id}`, {method:'PATCH', body:payload});
      showToast('Details saved.', 'ok');
      closeDrawer(); load();
    } catch (e) {
      if (e.message !== 'session expired') showToast('Could not save details: ' + e.message, 'err');
    }
  });
}

async function saveStatus(id){
  const btn = event.target;
  await withButtonLock(btn, async () => {
    const status = document.getElementById('dStatus').value;
    const note = document.getElementById('dStatusNote').value || null;
    try {
      await api(`/work-orders/${id}/status`, {method:'POST', body:{status, note}});
      showToast('Status updated.', 'ok');
      closeDrawer(); load();
    } catch (e) {
      if (e.message !== 'session expired') showToast('Could not update status: ' + e.message, 'err');
    }
  });
}

async function saveAssign(id){
  const btn = event.target;
  document.getElementById('dAssignErr').textContent = '';
  await withButtonLock(btn, async () => {
    const team_id = parseInt(document.getElementById('dTeam').value);
    const note = document.getElementById('dAssignNote').value || null;
    try {
      await api(`/work-orders/${id}/assign`, {method:'POST', body:{team_id, note}});
      showToast('Assignment saved.', 'ok');
      closeDrawer(); load();
    } catch (e) {
      if (e.status === 400) {
        document.getElementById('dAssignErr').textContent = e.message;
      } else if (e.message !== 'session expired') {
        showToast('Could not save assignment: ' + e.message, 'err');
      }
    }
  });
}

async function saveNote(id){
  const btn = event.target;
  await withButtonLock(btn, async () => {
    const note_text = document.getElementById('dNote').value;
    if (!note_text) { showToast('Write a note before saving.', 'err'); return; }
    try {
      await api(`/work-orders/${id}/notes`, {method:'POST', body:{note_text, note_type:'internal'}});
      showToast('Note added.', 'ok');
      closeDrawer(); load();
    } catch (e) {
      if (e.message !== 'session expired') showToast('Could not add note: ' + e.message, 'err');
    }
  });
}

function openNewWO(){
  const priorityOpts = PRIORITIES.map(p=>`<option value="${p}">${p}</option>`).join('');
  openDrawer(`
    <button class="close-btn" onclick="closeDrawer()">×</button>
    <h2>New Work Order</h2>
    <label>Requester name</label><input id="nName">
    <label>Requester email</label><input id="nEmail" type="email">
    <label>Requester phone</label><input id="nPhone">
    <label>Location / asset</label><div id="nLocationPicker"></div>
    <label>Work type</label>
    <select id="nType">
      <option value="NJ Maintenance">NJ Maintenance</option>
      <option value="NJ IT">NJ IT</option>
      <option value="NJ Items/Parts">NJ Items/Parts</option>
      <option value="NJ Transportation">NJ Transportation</option>
      <option value="">Other / blank</option>
    </select>
    <label>Priority</label><select id="nPriority">${priorityOpts}</select>
    <label>Description</label><textarea id="nDesc"></textarea>
    <div class="field-err" id="nErr"></div>
    <div class="drawer-actions"><button class="btn" onclick="createWO()">Create work order</button></div>
  `);
  newWoLocationPicker = LocationPicker.mount(document.getElementById('nLocationPicker'), {
    treeUrl: '/locations/tree',
    fetchOpts: { headers: { Authorization: 'Bearer ' + TOKEN } },
    placeholder: 'Search or browse locations…',
  });
}

async function createWO(){
  const btn = event.target;
  const errEl = document.getElementById('nErr');
  errEl.textContent = '';
  const name = document.getElementById('nName').value.trim();
  const desc = document.getElementById('nDesc').value.trim();
  const assetId = newWoLocationPicker ? newWoLocationPicker.getValue() : null;
  if (!name || !desc) { errEl.textContent = 'Requester name and description are required.'; return; }
  if (!assetId) { errEl.textContent = 'Choose a location.'; return; }
  await withButtonLock(btn, async () => {
    const payload = {
      requester_name: name,
      requester_email: document.getElementById('nEmail').value || null,
      requester_phone: document.getElementById('nPhone').value || null,
      asset_id: assetId,
      work_type: document.getElementById('nType').value,
      priority: document.getElementById('nPriority').value,
      description: desc,
    };
    try {
      const created = await api('/work-orders', {method:'POST', body:payload});
      showToast(`Created ${created.wo_number}.`, 'ok');
      closeDrawer(); load();
    } catch (e) {
      if (e.message !== 'session expired') errEl.textContent = e.message;
    }
  });
}

if (TOKEN) boot();
</script>
</body>
</html>
