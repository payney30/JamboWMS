<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Management Dashboard — National Jamboree Work Orders</title>
<style>
:root{
  --pine:#1C3829; --pine-deep:#122A1D; --canvas:#EFEADC; --canvas-panel:#FBF8F0;
  --khaki-line:#D8CFB6; --ink:#241F14; --ink-soft:#5B5340; --hivis:#E8620C; --hivis-soft:#F4A25E;
  --amber:#C9962B; --olive:#5C7A4A; --moss:#3E6B4F; --slate:#5A7385; --closed:#7A8471;
  --font-display: 'Oswald', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'SF Mono', 'Consolas', 'Menlo', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--canvas);color:var(--ink);font-family:var(--font-body);}
.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 60px;}
.topbar{background:var(--pine);color:var(--canvas-panel);border-radius:10px;padding:18px 24px;
  display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 0 var(--pine-deep);flex-wrap:wrap;gap:12px;}
.brand-eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--hivis-soft);margin:0 0 4px;}
.brand-title{font-family:var(--font-display);font-weight:600;font-size:24px;margin:0;text-transform:uppercase;}
.refresh-note{font-size:11px;color:var(--hivis-soft);}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:6px;}
.stat{background:var(--canvas-panel);border:1px solid var(--khaki-line);border-radius:8px;padding:14px 16px;}
.stat .num{font-family:var(--font-display);font-size:26px;font-weight:600;line-height:1;}
.stat .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-soft);margin-top:6px;}

.section-title{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.06em;font-size:13px;color:var(--ink-soft);margin:26px 0 10px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media (max-width:800px){.grid-2{grid-template-columns:1fr;}}
.card{background:var(--canvas-panel);border:1px solid var(--khaki-line);border-radius:8px;padding:16px;}
.card h3{font-family:var(--font-display);font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin:0 0 12px;}

.bar-row{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12px;}
.bar-label{width:130px;flex-shrink:0;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bar-track{flex:1;background:#F1EDDF;border-radius:4px;height:16px;overflow:hidden;}
.bar-fill{background:var(--moss);height:100%;border-radius:4px;}
.bar-count{width:34px;text-align:right;font-family:var(--font-mono);color:var(--ink-soft);}
.empty-note{color:var(--ink-soft);font-size:12px;padding:8px 0;}

#toastStack{position:fixed;bottom:16px;left:16px;right:16px;z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{background:var(--pine);color:#fff;border-radius:8px;padding:10px 14px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.2);}
.toast.err{background:var(--hivis);}

.footnote{font-size:11px;color:var(--ink-soft);margin-top:30px;text-align:center;}
</style>
</head>
<body>

<!-- Enhancement backlog Phase 20 (PRD §17#15): no login gate anywhere on
     this page, by design — this is the "share a link, no account needed"
     dashboard. Graphs/aggregate counts only; there is no WO-level detail
     of any kind here (no inbox, no individual WO lookup, no requester
     info) — see app/routers/public.py's dashboard endpoints for the
     access-control reasoning. -->
<div class="wrap" id="app">
  <div class="topbar">
    <div>
      <p class="brand-eyebrow">Public · Read-only · No sign-in required</p>
      <h1 class="brand-title">Management Dashboard</h1>
    </div>
    <div>
      <span class="refresh-note" id="refreshNote">Updates automatically every 60s</span>
    </div>
  </div>

  <div class="stats" id="statRow"></div>

  <div class="section-title">Opened vs. Closed — last 14 days</div>
  <div class="card">
    <div id="trendChart"></div>
  </div>

  <div class="section-title">Breakdown</div>
  <div class="grid-2">
    <div class="card"><h3>Status</h3><div id="byStatus"></div></div>
    <div class="card"><h3>Priority</h3><div id="byPriority"></div></div>
    <div class="card"><h3>Work type</h3><div id="byWorkType"></div></div>
    <div class="card"><h3>Location / area</h3><div id="byLocation"></div></div>
  </div>

  <div class="footnote">Aggregate counts and trends only — no individual work order details are shown on this page.</div>
</div>

<div id="toastStack"></div>

<script>
const API = '';
let refreshTimer = null;

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s == null ? '' : s;
  return d.innerHTML;
}
function showToast(msg, kind){
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.textContent = msg;
  document.getElementById('toastStack').appendChild(el);
  setTimeout(() => el.remove(), 5000);
}

// Enhancement backlog Phase 20 (PRD §17#15): no Authorization header
// anywhere in this file — every call here hits the public,
// unauthenticated /public/dashboard/* endpoints.
async function api(path) {
  const res = await fetch(API + path);
  if (res.status === 429) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.detail || 'Too many requests — please wait a moment and try again.');
  }
  if (!res.ok) throw new Error(res.statusText);
  return res.json();
}

async function load(){
  let kpis, breakdowns, trend;
  try {
    [kpis, breakdowns, trend] = await Promise.all([
      api('/public/dashboard/kpis'),
      api('/public/dashboard/breakdowns'),
      api('/public/dashboard/trend?days=14'),
    ]);
  } catch (e) {
    showToast('Could not refresh dashboard: ' + e.message, 'err');
    return;
  }
  renderStats(kpis);
  renderBars('byStatus', breakdowns.by_status);
  // Enhancement backlog Phase 14 (PRD §13#15): urgency-tier rename —
  // renderBars' `order` param strictly filters which keys can appear
  // at all, so omitting either the old or new names would silently make
  // WOs using that name invisible in this breakdown.
  renderBars('byPriority', breakdowns.by_priority, ['Immediate','Same Day','Next Day','2 Days','3 Days']);
  renderBars('byWorkType', breakdowns.by_work_type);
  renderBars('byLocation', breakdowns.by_location);
  renderTrend(trend);
}

function renderStats(k){
  const items = [
    {num:k.total, lbl:'Total'}, {num:k.requested, lbl:'Requested'},
    {num:k.open, lbl:'Active'}, {num:k.closed, lbl:'Closed'},
    {num:k.completion_rate+'%', lbl:'Completion Rate'},
  ];
  document.getElementById('statRow').innerHTML = items.map(i=>`<div class="stat"><div class="num">${i.num}</div><div class="lbl">${i.lbl}</div></div>`).join('');
}

function renderBars(elId, dataObj, order){
  const el = document.getElementById(elId);
  let entries = Object.entries(dataObj || {});
  if (order) {
    entries = order.filter(k => dataObj[k]).map(k => [k, dataObj[k]]);
  } else {
    entries.sort((a,b) => b[1]-a[1]);
  }
  if (!entries.length) { el.innerHTML = '<div class="empty-note">No data yet.</div>'; return; }
  const max = Math.max(...entries.map(e => e[1]));
  el.innerHTML = entries.map(([label, count]) => `
    <div class="bar-row">
      <div class="bar-label">${escapeHtml(label)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${max?Math.round(count/max*100):0}%"></div></div>
      <div class="bar-count">${count}</div>
    </div>
  `).join('');
}

function renderTrend(trend){
  const el = document.getElementById('trendChart');
  const w = 900, h = 200, pad = 30;
  const max = Math.max(1, ...trend.map(d => Math.max(d.opened, d.closed)));
  const stepX = (w - pad*2) / (trend.length - 1 || 1);
  const y = v => h - pad - (v / max) * (h - pad*2);
  const line = (key) => trend.map((d,i) => `${i===0?'M':'L'} ${pad+i*stepX} ${y(d[key])}`).join(' ');
  const labels = trend.map((d,i) => i % Math.ceil(trend.length/7) === 0
    ? `<text x="${pad+i*stepX}" y="${h-8}" font-size="9" fill="var(--ink-soft)" text-anchor="middle">${d.date.slice(5)}</text>` : '').join('');
  el.innerHTML = `
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;font-family:var(--font-mono);">
      <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--khaki-line)" />
      <path d="${line('opened')}" fill="none" stroke="var(--hivis)" stroke-width="2" />
      <path d="${line('closed')}" fill="none" stroke="var(--moss)" stroke-width="2" />
      ${labels}
    </svg>
    <div style="display:flex;gap:16px;font-size:11px;color:var(--ink-soft);margin-top:6px;">
      <span><span style="display:inline-block;width:10px;height:10px;background:var(--hivis);border-radius:2px;margin-right:4px;"></span>Opened</span>
      <span><span style="display:inline-block;width:10px;height:10px;background:var(--moss);border-radius:2px;margin-right:4px;"></span>Closed</span>
    </div>
  `;
}

load();
refreshTimer = setInterval(load, 60000);
</script>
</body>
</html>
